:root{
  --bg:#040614;
  --surface:#0a0e24;
  --surface2:#10163a;
  --line:#2a3160;
  --text:#edf2ff;
  --muted:#9aa3c8;
  --gold:#f2c94c;
  --cyan:#35e0ff;
  --violet:#b18cff;
  --violet2:#7c5cff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.shell {
  min-height: 100vh;
  padding: var(--safe-area-inset-top) 0 0;
  background: radial-gradient(circle at 50% 0, rgba(124, 92, 255, 0.18), transparent 38%), radial-gradient(circle at 85% 30%, rgba(53, 224, 255, 0.08), transparent 28%), var(--bg);
  overflow-x: clip;
}

.shell.dark-mode {
  filter: brightness(0.48) saturate(0.72);
  background: #010208;
}

.topbar {
  max-width: 1440px;
  margin: 0 auto;
  padding: 28px 28px 18px;
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: flex-start;
  border-bottom: 1px solid var(--line);
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.24em;
  color: var(--cyan);
  margin: 0 0 9px;
  font-weight: 800;
}

h1 {
  font-size: clamp(32px, 5vw, 64px);
  line-height: 0.92;
  letter-spacing: -0.06em;
  margin: 0;
  max-width: 850px;
}

h1 span {
  color: var(--gold);
  display: block;
  font-size: 0.62em;
  letter-spacing: -0.04em;
}

.intro {
  color: var(--muted);
  max-width: 720px;
  line-height: 1.55;
  font-size: 14px;
}

.light-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 12px 16px;
  border-radius: 999px;
  text-align: left;
  min-width: 125px;
}

.light-btn.on {
  background: #fff3bd;
  color: #201600;
  border-color: var(--gold);
}

.light-btn span {
  font-size: 10px;
  line-height: 1.2;
}

.light-btn strong {
  font-size: 13px;
}

main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 0.92fr 1.18fr 0.9fr;
  gap: 18px;
}

section {
  background: rgba(10, 14, 36, 0.84);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  min-width: 0;
}

.section-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  margin-bottom: 14px;
}

.section-head span {
  color: var(--cyan);
  font-size: 11px;
}

.section-head h2 {
  margin: 0;
  font-size: 19px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.section-head small {
  margin-left: auto;
  color: var(--muted);
  font-size: 11px;
  text-align: right;
}

.hint {
  display: flex;
  gap: 7px;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 16px;
}

.tower {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 10px 0 16px;
}

.step {
  width: 100%;
  border: 1px solid transparent;
  border-radius: 9px;
  color: white;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 13px;
  text-align: left;
  min-height: 58px;
  transition: 0.18s;
}

.step.cyan {
  background: linear-gradient(90deg, #073d4d, #0e8da8);
  border-color: #35e0ff;
}

.step.violet {
  background: linear-gradient(90deg, #291a58, #6745b6);
  border-color: #b18cff;
}

.step.gold {
  background: linear-gradient(90deg, #4e3905, #b68b19);
  border-color: var(--gold);
  color: #fff8dc;
}

.step:hover {
  transform: translateY(-2px);
  filter: brightness(1.12);
}

.step.active {
  outline: 3px solid #ffffff;
  box-shadow: 0 0 28px rgba(242, 201, 76, 0.35);
}

.step-num {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -0.06em;
  min-width: 68px;
}

.step-meta {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.step-meta strong {
  font-size: 10px;
  line-height: 1.2;
  text-transform: uppercase;
}

.step-meta em {
  font-size: 11px;
  opacity: 0.85;
  font-style: normal;
}

.step-arrow {
  margin-left: auto;
  font-size: 18px;
}

.stack-note {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 13px;
  font-size: 10px;
}

.stack-note div {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.stack-note b {
  color: var(--text);
}

.stack-note span {
  color: var(--muted);
}

.gold-text b, .gold-text span {
  color: var(--gold);
}

.scene{
  position:relative;
  padding:8px 0 4px;
  perspective:900px
}

.axis-labels{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px
}

.tilt{
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.18s ease
}

.star-svg{
  width:100%;
  max-height:380px;
  display:block
}

.orbit{
  fill:none;
  stroke:#2d366a;
  stroke-width:1;
  stroke-dasharray:3 5
}

.orbit.inner{
  stroke:#6b5aa6
}

.star{
  fill:rgba(124,92,255,0.12);
  stroke:var(--gold);
  stroke-width:2;
  stroke-linejoin:round
}

.node{
  fill:#090d22;
  stroke:var(--cyan);
  stroke-width:1.5
}

.node-text{
  fill:white;
  font-weight:700;
  font-size:10px
}

.center-node{
  fill:var(--gold);
  stroke:white
}

.center-text{
  fill:#111111;
  font-weight:800;
  font-size:8px
}

.top-tag,.bottom-tag{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-weight:900;
  font-size:12px;
  letter-spacing:0.14em;
  padding:4px 8px;
  border-radius:4px
}

.top-tag{
  top:3px;
  background:var(--gold);
  color:#1c1300
}

.bottom-tag{
  bottom:20px;
  background:var(--cyan);
  color:#001a21
}

.legend{
  display:flex;
  justify-content:center;
  gap:16px;
  color:var(--muted);
  font-size:11px;
  margin-top:8px
}

.dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  margin-right:4px
}

.dot.gold{
  background:var(--gold)
}

.dot.cyan{
  background:var(--cyan)
}

.dot.violet{
  background:var(--violet)
}

.blackhole-halo {
  fill: rgba(242, 201, 76, 0.12);
  stroke: rgba(242, 201, 76, 0.45);
  stroke-width: 1;
}

.blackhole-halo.touched {
  fill: rgba(53, 224, 255, 0.14);
  stroke: #35e0ff;
}

.blackhole-core {
  fill: #000000;
  stroke: #f2c94c;
  stroke-width: 1.5;
}

.blackhole-ring {
  fill: none;
  stroke: rgba(255, 255, 255, 0.55);
  stroke-width: 1;
  stroke-dasharray: 2 4;
}

.center-text {
  fill: #ffffff;
  font-weight: 800;
  font-size: 8px;
}

.thought-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #0c112d;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 12px;
  padding: 13px;
  text-align: left;
  margin-top: 14px;
}

.thought-btn.active {
  border-color: var(--cyan);
  background: #082a33;
}

.thought-dot {
  color: #000000;
  background: #000000;
  border: 2px solid var(--gold);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  font-size: 10px;
  flex: 0 0 auto;
}

.thought-btn span {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.thought-btn small {
  color: var(--muted);
  font-size: 10px;
}

.thought-btn em {
  margin-left: auto;
  font-style: normal;
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
}

.thought-note {
  font-size: 12px;
  line-height: 1.55;
  color: var(--muted);
  margin: 10px 0 0;
}

.bridge {
  display: grid;
  grid-template-columns: 1fr 1.4fr 1fr;
  gap: 9px;
  margin-top: 16px;
}

.bridge button, .bridge-line {
  background: var(--surface2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.bridge button.on {
  border-color: var(--cyan);
  background: #0a2f3a;
  color: #aef2ff;
}

.bridge-line {
  justify-content: center;
  text-align: center;
}

.bridge-line strong {
  font-size: 10px;
}

.bridge-line span {
  color: var(--gold);
}

.bridge button small, .bridge-line small {
  color: var(--muted);
  font-size: 9px;
}

.bridge-note {
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  margin: 10px 0 0;
}

.equations {
  display: grid;
  gap: 9px;
}

.eq {
  display: grid;
  grid-template-columns: 1fr 18px auto;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 14px;
  text-align: left;
}

.eq:hover, .eq.active {
  border-color: var(--gold);
}

.eq-a {
  font-weight: 800;
}

.eq strong {
  color: var(--gold);
  font-size: 22px;
}

.eq small {
  grid-column: 1 / 4;
  color: var(--muted);
  font-size: 11px;
}

.eq em {
  grid-column: 1 / 4;
  color: var(--cyan);
  font-size: 10px;
  font-style: normal;
}

.formula-strip {
  margin: 14px 0;
  padding: 13px;
  background: #151133;
  border: 1px solid #4c3b8a;
  border-radius: 10px;
  text-align: center;
  font-size: 12px;
  line-height: 1.8;
}

.formula-strip b {
  color: var(--gold);
}

.controls {
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.controls-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.controls-head h3 {
  font-size: 13px;
  margin: 0;
}

.controls-head button {
  margin-left: auto;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 20px;
  padding: 6px 9px;
  display: flex;
  gap: 5px;
  align-items: center;
}

.slider-row {
  display: grid;
  grid-template-columns: 70px 1fr 45px;
  gap: 10px;
  align-items: center;
  margin-top: 15px;
  font-size: 11px;
}

.slider-row input {
  width: 100%;
  accent-color: var(--gold);
}

.slider-row b {
  text-align: right;
  color: var(--gold);
}

.controls p {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
}

.detail {
  max-width: 1384px;
  margin: 0 28px 24px;
  padding: 22px;
}

.detail-head {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: flex-start;
}

.detail-head p {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--cyan);
  margin: 0 0 5px;
}

.detail-head h2 {
  font-size: clamp(22px, 3vw, 34px);
  margin: 0;
}

.detail-head h2 span {
  color: var(--gold);
  font-size: 1.35em;
}

.detail-formula {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #1d1804;
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 10px 14px;
  border-radius: 999px;
  white-space: nowrap;
}

.detail-meta {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 12px 0;
  margin: 18px 0;
  color: var(--muted);
  font-size: 12px;
}

.detail-meta b {
  color: white;
}

.field-grid {
  display: grid;
  gap: 4px;
}

.cols-3 {
  grid-template-columns: repeat(3, 1fr);
}

.cols-9 {
  grid-template-columns: repeat(9, 1fr);
}

.cols-27 {
  grid-template-columns: repeat(27, 1fr);
}

.cell {
  aspect-ratio: 1;
  border: 1px solid #303963;
  background: #0c112d;
  color: #b9c0e5;
  border-radius: 4px;
  display: grid;
  place-items: center;
  padding: 0;
  min-width: 0;
}

.cell span {
  font-size: 9px;
}

.cols-27 .cell span {
  font-size: 5px;
}

.cell:hover {
  background: var(--cyan);
  color: #00121a;
}

.cell.active {
  background: var(--gold);
  color: #1c1300;
  border-color: white;
  font-weight: 900;
}

.field-grid.dense {
  gap: 2px;
}

.field-grid.dense .cell {
  border-radius: 2px;
}

.corners {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 18px;
}

.corner {
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, #2b2102, #100c02);
  padding: 20px;
  border-radius: 12px;
  text-align: left;
  min-height: 190px;
}

.corner span {
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.2em;
}

.corner h3 {
  font-size: 30px;
  margin: 14px 0 8px;
}

.corner p {
  color: #d8d0b4;
  line-height: 1.55;
  font-size: 13px;
}

.corner b {
  font-size: 28px;
}

.corner-note {
  grid-column: 1 / -1;
  background: var(--surface2);
  padding: 13px;
  border-radius: 8px;
  font-size: 13px;
}

.zones {
  max-width: 1384px;
  margin: 0 28px 24px;
  padding: 22px;
}

.rings {
  display: flex;
  justify-content: center;
  padding: 18px 0 8px;
}

.ring {
  border: 1px dashed #3a4470;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: 0.18s;
}

.ring-3 {
  width: min(560px, 100%);
  aspect-ratio: 2.4;
}

.ring-2 {
  width: 76%;
  aspect-ratio: 2.4;
}

.ring-1 {
  width: 70%;
  aspect-ratio: 2.4;
}

.ring-0 {
  width: 58%;
  aspect-ratio: 2.2;
  background: #000000;
  border-style: solid;
  border-color: var(--gold);
  color: #ffffff;
}

.ring span {
  position: absolute;
  top: 7px;
  left: 14px;
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--muted);
}

.ring-0 span {
  color: var(--gold);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 10px;
}

.ring.active {
  border-color: var(--cyan);
  background: rgba(53, 224, 255, 0.08);
  box-shadow: 0 0 24px rgba(53, 224, 255, 0.18);
}

.ring-0.active {
  background: #000000;
  box-shadow: 0 0 28px rgba(242, 201, 76, 0.4);
}

.zone-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 16px;
}

.zone-card {
  background: var(--surface2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 12px;
  padding: 16px;
  text-align: left;
  min-height: 170px;
}

.zone-card:hover {
  transform: translateY(-2px);
}

.zone-card.active {
  border-color: var(--gold);
  background: #241d05;
  outline: 2px solid rgba(242, 201, 76, 0.5);
}

.zone-card span {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--cyan);
}

.zone-card h3 {
  font-size: 24px;
  margin: 10px 0 8px;
}

.zone-card p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
  margin: 0 0 12px;
}

.zone-card b {
  color: var(--gold);
  font-size: 11px;
}

.zone-note {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
  background: rgba(53, 224, 255, 0.06);
  border-left: 3px solid var(--cyan);
  padding: 12px 14px;
  margin: 16px 0 0;
}

footer {
  max-width: 1440px;
  margin: auto;
  padding: 0 28px 26px;
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
}

@media (max-width: 900px) {
  main {
    grid-template-columns: 1fr;
  }

  .topbar {
    flex-direction: column;
  }

  .light-btn {
    align-self: flex-start;
  }

  .detail {
    margin: 0 16px 20px;
  }

  main {
    padding: 16px;
  }

  footer {
    flex-direction: column;
    gap: 6px;
  }
}

@media (max-width: 560px) {
  .topbar {
    padding: 22px 16px 16px;
  }

  main {
    padding: 12px;
    gap: 12px;
  }

  section {
    padding: 14px;
  }

  .step {
    padding: 9px 10px;
  }

  .step-num {
    font-size: 23px;
    min-width: 54px;
  }

  .step-meta strong {
    font-size: 9px;
  }

  .step-meta em {
    font-size: 10px;
  }

  .detail-head {
    flex-direction: column;
  }

  .detail-formula {
    align-self: flex-start;
  }

  .bridge {
    grid-template-columns: 1fr;
  }

  .bridge-line {
    order: -1;
  }

  .corners {
    grid-template-columns: 1fr;
  }

  .corner {
    min-height: 0;
  }

  .cols-27 {
    gap: 1px;
  }

  .cols-27 .cell span {
    display: none;
  }

  .cols-9 .cell span {
    font-size: 6px;
  }

  .detail {
    padding: 16px;
  }

  .section-head small {
    display: none;
  }

  .stack-note {
    font-size: 9px;
  }

  .legend {
    flex-wrap: wrap;
    gap: 8px;
  }

  .thought-btn em {
    display: none;
  }

  .zone-cards {
    grid-template-columns: 1fr;
  }

  .zone-card {
    min-height: 0;
  }

  .zones {
    margin: 0 16px 20px;
    padding: 16px;
  }

  .ring-3 {
    aspect-ratio: 1.6;
  }

  .ring-2 {
    aspect-ratio: 1.6;
  }

  .ring-1 {
    aspect-ratio: 1.6;
  }

  .ring-0 {
    aspect-ratio: 1.4;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #040614;
    --text: #edf2ff;
  }
}
