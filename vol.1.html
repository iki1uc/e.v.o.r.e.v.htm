<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DIAMANT.vector · Stabilitäts‑Achse (6e)</title>

<link rel="stylesheet" href="style.css">

<style>
body{background:#000;color:#0f0;font-family:Consolas, monospace;padding:20px;}
pre{background:#111;padding:12px;border:1px solid #333;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;}
.cell{background:#111;border:1px solid #333;padding:20px;text-align:center;}
button{background:#111;color:#0f0;border:1px solid #333;padding:8px 16px;margin-top:10px;}
</style>
</head>

<body>

<h1>DIAMANT.vector · Stabilitäts‑Achse (6e)</h1>
<p>Der Fixpunkt des neuen 6‑Vektor‑Systems.</p>

<hr>

<h2>Diamant‑Kern</h2>
<pre>
◈ Stabilität
◆ Schlag
▣ Raum
△ Form

DIAMANT = Fixpunkt + Wahrheit + Wiederholbarkeit
</pre>

<hr>

<h2>Stabilitäts‑Matrix (8 Richtungen + ∞)</h2>

<div class="grid">
  <div class="cell">NW</div>
  <div class="cell">N</div>
  <div class="cell">NE</div>

  <div class="cell">W</div>
  <div class="cell" style="background:#222;">◈<br><small>Diamant‑Fixpunkt</small></div>
  <div class="cell">E</div>

  <div class="cell">SW</div>
  <div class="cell">S</div>
  <div class="cell">SE</div>
</div>

<hr>

<h2>Diamant‑Score</h2>
<pre id="score">Bereit...</pre>

<button onclick="calc()">DIAMANT‑BERECHNEN</button>

<script src="anker.js"></script>
<script src="atom.js"></script>
<script src="respo.js"></script>

<script>
function calc(){
  const dirs = ["N","NE","E","SE","S","SW","W","NW"];
  const stability = 3; // Diamant = höchste Stabilität
  const continuum = dirs.length / 8; // ∞ Punkt
  const fix = 4; // Fixpunkt-Wert aus diamant.csv Logik

  const total = stability + continuum + fix;

  const out = {
    vektor: "DIAMANT.vector",
    stabilitaet: stability,
    continuum: continuum,
    fixpunkt: fix,
    score: total,
    status: "ok"
  };

  score.textContent = JSON.stringify(out, null, 2);
}
</script>

</body>
</html>
