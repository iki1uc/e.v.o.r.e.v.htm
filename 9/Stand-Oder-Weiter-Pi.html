.transition{

:root{
  --bg:#0a0f0a;
  --surface:#111a12;
  --surface2:#17231a;
  --line:#2a3d2d;
  --text:#e8f2e8;
  --muted:#9db3a0;
  --green:#3ddc78;
  --green-dim:#1f6b3a;
  --gold:#e8c24a;
  --gold-dim:#8a6d1f;
  --red:#ff6b6b;
  --card:#121c14;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0f0a;
    --surface:#111a12;
    --text:#e8f2e8;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

button, input, select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible, input:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

.range{
  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  width:100%;
  height:8px;
  border-radius:99px;
  background:#223322;
  border:1px solid var(--line);
}

.range::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--gold);
  border:3px solid #0a0f0a;
  box-shadow:0 0 0 2px var(--gold);
  cursor:pointer;
}

.range::-moz-range-thumb{
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--gold);
  border:3px solid #0a0f0a;
  cursor:pointer;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
}

.chip{
  border:1px solid var(--line);
  border-radius:99px;
  padding:6px 10px;
  font-size:12px;
}

input[type="checkbox"]{
  width:20px;
  height:20px;
  accent-color:var(--green);
}

@keyframes pulseSoft{
  0%,100%{
    opacity:.75
  }

  50%{
    opacity:1
  }
}

.soft{
  animation:pulseSoft 2.4s ease-in-out infinite;
}

.hover\:border-\[\#556b59\]:hover{
  --tw-border-opacity: 1;
  border-color: rgb(85 107 89 / var(--tw-border-opacity, 1));
}

.hover\:border-\[var\(--gold\)\]:hover{
  border-color: var(--gold);
}

.hover\:border-\[var\(--green\)\]:hover{
  border-color: var(--green);
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.hover\:brightness-110:hover{
  --tw-brightness: brightness(1.1);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

@media (min-width: 640px){
  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-8{
    padding-top: 2rem;
    padding-bottom: 2rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-\[30px\]{
    font-size: 30px;
  }

  .sm\:text-\[48px\]{
    font-size: 48px;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1fr_auto_1fr\]{
    grid-template-columns: 1fr auto 1fr;
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.55fr_1fr\]{
    grid-template-columns: 1.55fr 1fr;
  }

  .lg\:grid-cols-\[1\.65fr_1fr\]{
    grid-template-columns: 1.65fr 1fr;
  }

  .lg\:grid-cols-\[1fr_1\.15fr\]{
    grid-template-columns: 1fr 1.15fr;
  }
}
