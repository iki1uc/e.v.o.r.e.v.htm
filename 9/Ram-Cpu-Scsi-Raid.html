  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur {
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

:root{
  --bg:#0b0e0c;
  --surface:#121713;
  --surface-2:#18211b;
  --line:#2a352d;
  --gold:#e8c873;
  --gold-soft:#f3dd9a;
  --green:#7ec99a;
  --cyan:#8fc9c2;
  --text:#f2ecdc;
  --muted:#a9b4a3;
  --ink:#10130f;
  --ease:2s;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0d0b;
    --surface:#111613;
    --surface-2:#17201a;
    --line:#2b362d;
    --text:#f3eddd;
    --muted:#aab5a4;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif
}

.mono{
  font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace
}

.serif{
  font-family:Georgia,"Times New Roman",serif
}

.slow{
  transition-duration:var(--ease) !important
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

button:focus-visible,input:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px
}

.chip{
  transition:all var(--ease)
}

.bar{
  transition:width var(--ease) ease, background var(--ease)
}

.dot{
  transition:all var(--ease)
}

@keyframes breathe{
  0%,100%{
    opacity:.55
  }

  50%{
    opacity:1
  }
}

.breathe{
  animation:breathe 4s ease-in-out infinite
}

@keyframes drift{
  0%{
    transform:translateX(0)
  }

  100%{
    transform:translateX(6px)
  }
}

.drift{
  animation:drift 3s ease-in-out infinite alternate
}

.placeholder\:text-\[var\(--muted\)\]::-moz-placeholder {
  color: var(--muted);
}

.placeholder\:text-\[var\(--muted\)\]::placeholder {
  color: var(--muted);
}

.last\:border-0:last-child {
  border-width: 0px;
}

.hover\:border-\[var\(--gold\)\]:hover {
  border-color: var(--gold);
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-7 {
    padding-left: 1.75rem;
    padding-right: 1.75rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-3xl {
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px) {
  .md\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-\[1\.25fr_0\.75fr\] {
    grid-template-columns: 1.25fr 0.75fr;
  }

  .lg\:grid-cols-\[1\.35fr_0\.65fr\] {
    grid-template-columns: 1.35fr 0.65fr;
  }

  .lg\:grid-cols-\[1fr_1\.5fr\] {
    grid-template-columns: 1fr 1.5fr;
  }

  .lg\:items-end {
    align-items: flex-end;
  }

  .lg\:px-10 {
    padding-left: 2.5rem;
    padding-right: 2.5rem;
  }

  .lg\:py-12 {
    padding-top: 3rem;
    padding-bottom: 3rem;
  }

  .lg\:text-7xl {
    font-size: 4.5rem;
    line-height: 1;
  }
}

@media (min-width: 1280px) {
  .xl\:col-span-1 {
    grid-column: span 1 / span 1;
  }

  .xl\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
