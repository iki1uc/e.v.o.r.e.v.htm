:root{
  --bg:#0d0f0c;
  --surface:#151811;
  --surface2:#1c2016;
  --line:#2d3123;
  --gold:#e8c87a;
  --cyan:#67e8f9;
  --green:#7ec98a;
  --ink:#f2ead2;
  --muted:#a9ad94;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f0c;
    --surface:#151811;
    --surface2:#1c2016;
    --line:#2d3123;
    --ink:#f2ead2;
    --muted:#a9ad94;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia, "Times New Roman", serif
}

button,input,select,textarea{
  font-family:inherit
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}

a{
  color:var(--cyan)
}

.cube-scene{
  perspective:900px
}

.cube{
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.2,.8,.2,1)
}

.cube-face{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid var(--gold);
  background:rgba(21,24,17,.92);
  backface-visibility:hidden
}

input[type=range]{
  accent-color:var(--gold);
  width:100%
}

canvas{
  max-width:100%;
  height:auto
}
