:root {
  --bg: #0a100b;
  --surface: #142016;
  --surface2: #1a2a1d;
  --line: #35482f;
  --text: #f0ead8;
  --muted: #aab99c;
  --green: #9ed99a;
  --dark-green: #5f8a52;
  --gold: #f5c86e;
  --brown: #c7a876;
  --blue: #8cc7d8;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}

button {
  font: inherit;
}

.shell {
  min-height: 100vh;
  padding-top: var(--safe-area-inset-top);
  background: radial-gradient(circle at 50% 0, #20331f 0, var(--bg) 52%, #060a06 100%);
  overflow-x: clip;
}

.page {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: 28px 18px 34px;
}

.hero {
  text-align: center;
  padding: 12px 0 24px;
}

.eyebrow {
  color: var(--green);
  font-size: 11px;
  letter-spacing: .28em;
  display: flex;
  justify-content: center;
  gap: 12px;
  align-items: center;
}

.eyebrow span {
  color: var(--gold);
}

h1 {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 900;
  font-size: clamp(42px, 8vw, 84px);
  line-height: .86;
  letter-spacing: -.04em;
  margin: 16px 0 12px;
  text-shadow: 0 8px 40px rgba(0,0,0,.5);
}

h1 em {
  color: var(--green);
  font-weight: 700;
  font-size: .62em;
  letter-spacing: .02em;
}

.hero p {
  color: var(--muted);
  font-size: 16px;
  margin: 0;
}

.hero p strong {
  color: var(--text);
}

.hero-line {
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  color: #d7cfae;
  font-size: 11px;
  letter-spacing: .08em;
  margin-top: 18px;
}

.hero-line span {
  border-bottom: 1px solid #4c5e3d;
  padding-bottom: 4px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.stat {
  background: linear-gradient(180deg, #18261a, #111c12);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 15px;
  min-height: 110px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.stat.strong {
  border-color: #77602b;
  background: linear-gradient(180deg, #2b2715, #17180f);
}

.stat .label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .22em;
}

.stat strong {
  font-family: "Fraunces", Georgia, serif;
  font-size: 27px;
  line-height: 1;
}

.stat small {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}

.bar {
  height: 5px;
  background: #253523;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 2px;
}

.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--gold));
  border-radius: inherit;
  transition: width .45s ease;
}

.field-wrap {
  margin-top: 16px;
  background: #0f1a10;
  border: 1px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 24px 70px rgba(0,0,0,.35);
}

.field-wrap.storm {
  animation: shake .18s linear 4;
}

.field-wrap.flash {
  animation: pulse 1s ease;
}

@keyframes shake {
  25% {
    transform: translateX(-5px);
  }

  75% {
    transform: translateX(5px);
  }
}

@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(245,200,110,.7);
  }

  100% {
    box-shadow: 0 0 0 45px transparent;
  }
}

.field-top {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  padding: 18px 20px 8px;
}

.field-kicker {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: .24em;
}

.field-top h2 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 23px;
  margin: 5px 0 0;
}

.legend {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  background: #9ed99a;
}

.dot.fixed {
  background: var(--gold);
  box-shadow: 0 0 8px var(--gold);
}

.dot.picked {
  background: #fff;
}

.field {
  position: relative;
  margin: 8px 12px 12px;
  border-radius: 16px;
  overflow: hidden;
}

.soil-svg {
  display: block;
  width: 100%;
  height: auto;
  min-height: 360px;
}

.cell {
  fill: transparent;
  stroke: rgba(255,255,255,.06);
  stroke-width: 1;
  cursor: pointer;
  transition: fill .2s;
}

.cell:hover {
  fill: rgba(158,217,154,.18);
}

.cell-loose {
  fill: rgba(158,217,154,.07);
}

.cell-fixed {
  fill: rgba(245,200,110,.13);
  stroke: rgba(245,200,110,.35);
}

.cell-picked {
  fill: rgba(255,255,255,.2);
  stroke: #fff;
}

.root path {
  fill: none;
  stroke: #9ed99a;
  stroke-width: 3;
  stroke-linecap: round;
  opacity: .88;
}

.root .branch {
  stroke-width: 1.6;
  opacity: .6;
}

.root circle {
  fill: #d5e99d;
}

.root text {
  fill: #10210f;
  font-size: 16px;
  font-weight: 700;
}

.root.fixed path {
  stroke: var(--gold);
  stroke-width: 4;
  filter: drop-shadow(0 0 4px rgba(245,200,110,.8));
}

.root.fixed circle {
  fill: var(--gold);
}

.root.fixed text {
  fill: #31230b;
}

.sprout {
  animation: sway 4s ease-in-out infinite;
  transform-origin: 0 0;
}

@keyframes sway {
  0%,100% {
    transform: rotate(-1.5deg);
  }

  50% {
    transform: rotate(1.5deg);
  }
}

.svg-title {
  fill: #f0ead8;
  font-family: "Fraunces", Georgia, serif;
  font-size: 20px;
  letter-spacing: .24em;
  font-weight: 900;
}

.svg-sub {
  fill: #c9d5bb;
  font-size: 13px;
  letter-spacing: .08em;
}

.field-hint {
  position: absolute;
  left: 14px;
  bottom: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: #e8e2c9;
  background: rgba(8,12,8,.72);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 99px;
  padding: 8px 12px;
  font-size: 11px;
  backdrop-filter: blur(4px);
}

.controls {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-top: 14px;
}

.controls button {
  min-height: 54px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #1d2f1f;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-weight: 700;
  letter-spacing: .06em;
  cursor: pointer;
  transition: transform .15s, filter .15s;
}

.controls button:hover {
  transform: translateY(-2px);
  filter: brightness(1.15);
}

.controls button:active {
  transform: translateY(0);
}

.controls .gold {
  background: linear-gradient(135deg, #e5b84d, #a67821);
  color: #1d1706;
}

.controls .blue {
  background: #173a42;
  border-color: #4f8290;
}

.controls .storm-btn {
  background: #332d26;
  border-color: #8a7660;
}

.controls .wonder {
  background: #3a2731;
  border-color: #9b6b82;
}

.bottom {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: 14px;
  margin-top: 14px;
}

.roots-list, .log-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 17px;
  min-height: 230px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--green);
  margin-bottom: 13px;
}

.section-head small {
  color: var(--muted);
  letter-spacing: 0;
}

.section-head span {
  display: flex;
  align-items: center;
  gap: 7px;
}

.root-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.chip {
  border: 1px solid var(--line);
  background: #101c10;
  color: var(--text);
  padding: 8px 10px;
  border-radius: 99px;
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
}

.chip.active {
  border-color: var(--gold);
  background: #2a2617;
}

.mini {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}

.mini.fixed {
  background: var(--gold);
}

.empty {
  color: var(--muted);
  font-size: 12px;
}

.tip {
  color: #c9bfa0;
  font-size: 12px;
  line-height: 1.6;
  display: flex;
  gap: 8px;
  margin: 18px 0 0;
}

.log-panel ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 9px;
}

.log-panel li {
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  border-left: 2px solid #44563c;
  padding-left: 10px;
}

.log-panel li.grow {
  color: #d4e8c8;
  border-color: var(--green);
}

.log-panel li.root {
  color: #ffeeb1;
  border-color: var(--gold);
}

.log-panel li.water {
  color: #c6e9f0;
  border-color: var(--blue);
}

.log-panel li.storm {
  color: #ffcab5;
  border-color: #ff8d68;
}

.log-panel li.wonder {
  color: #ffd1e0;
  border-color: #ef9bb9;
}

footer {
  text-align: center;
  color: #74836c;
  font-size: 10px;
  letter-spacing: .16em;
  padding: 24px 0 4px;
}

.rain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: hidden;
}

.rain i {
  position: absolute;
  top: -20px;
  width: 2px;
  height: 22px;
  background: linear-gradient(transparent, #9dd7e8);
  display: block;
  animation: fall .7s linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(560px);
  }
}

.particle {
  position: absolute;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  z-index: 5;
  animation: float 1.5s ease-out forwards;
}

@keyframes float {
  to {
    opacity: 0;
    transform: translateY(-48px) scale(.2);
  }
}

@media (max-width: 760px) {
  .page {
    padding: 18px 12px 28px;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .stat:last-child {
    grid-column: span 2;
  }

  .field-top {
    flex-direction: column;
    align-items: flex-start;
  }

  .legend {
    white-space: normal;
  }

  .controls {
    grid-template-columns: repeat(2, 1fr);
  }

  .controls .wonder {
    grid-column: span 2;
  }

  .bottom {
    grid-template-columns: 1fr;
  }

  .field-hint {
    font-size: 10px;
    max-width: calc(100% - 28px);
  }

  .hero-line {
    gap: 12px;
  }
}

@media (max-width: 420px) {
  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .stat {
    min-height: 104px;
    padding: 12px;
  }

  .stat strong {
    font-size: 23px;
  }
}
</style>
