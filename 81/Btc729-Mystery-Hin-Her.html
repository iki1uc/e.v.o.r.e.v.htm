:root{
  --bg:#0d0f0c;
  --panel:#131610;
  --line:#26281f;
  --ink:#f2efe8;
  --muted:#9a958a;
  --gold:#e8c87a;
  --green:#7ec98a;
  --red:#ff8a8a;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink)
}

body{
  font:14px/1.6 Georgia, "Times New Roman", serif
}

.shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  max-width:1080px;
  margin:0 auto;
  padding-left:18px;
  padding-right:18px;
  padding-bottom:40px
}

header{
  border-bottom:1px solid var(--line);
  padding:22px 0 16px;
  margin-bottom:18px
}

.eyebrow{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.2em;
  color:var(--gold);
  text-transform:uppercase;
  margin:0
}

h1{
  font-weight:400;
  font-size:34px;
  line-height:1.15;
  margin:10px 0
}

h1 span{
  color:var(--gold)
}

.rule{
  font-style:italic;
  color:var(--muted);
  font-size:14px;
  margin:0
}

.rule b{
  color:var(--ink)
}

.status{
  margin:10px 0 0;
  font:12px/1.5 ui-monospace,monospace;
  color:var(--muted);
  display:flex;
  gap:8px;
  align-items:center
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  display:inline-block;
  flex:none
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:14px
}

figure{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
  position:relative;
  aspect-ratio:1.618/1;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0
}

figure.tel{
  border-color:#4a5a44
}

figcaption{
  position:absolute;
  top:8px;
  left:12px;
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  z-index:2;
  background:rgba(13,15,12,.72);
  padding:4px 6px;
  border-radius:6px
}

figcaption b{
  color:var(--gold)
}

canvas{
  max-width:100%;
  max-height:100%;
  display:block
}

.cap{
  position:absolute;
  bottom:8px;
  left:12px;
  right:12px;
  font:11px/1.4 ui-monospace,monospace;
  color:#e8e4da;
  background:rgba(13,15,12,.68);
  padding:5px 7px;
  border-radius:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.empty{
  padding:20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  font-style:italic
}

.empty small{
  display:block;
  margin-top:8px;
  font-style:normal;
  font-family:ui-monospace,monospace;
  font-size:11px
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
  margin-bottom:12px
}

.metrics>div{
  background:var(--panel);
  padding:12px 14px
}

.metrics small{
  font:9px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  display:block
}

.metrics b{
  font-size:19px;
  font-weight:400;
  display:block;
  margin-top:4px;
  word-break:break-word
}

.metrics b.pos{
  color:var(--green)
}

.metrics b.neg{
  color:var(--red)
}

.metrics b.gold{
  color:var(--gold)
}

.fixline{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  padding:10px 14px;
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:13px;
  font:12px/1.6 ui-monospace,monospace;
  color:var(--muted);
  margin-bottom:14px
}

.fixline b{
  color:var(--ink)
}

.ok{
  color:var(--green)
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  padding:16px;
  margin-bottom:14px
}

.panel h2{
  font:11px/1 ui-monospace,monospace;
  letter-spacing:.2em;
  color:var(--gold);
  text-transform:uppercase;
  margin:0 0 12px;
  font-weight:400
}

.controls{
  display:grid;
  gap:10px;
  margin-bottom:12px
}

.ctl{
  display:grid;
  grid-template-columns:80px 1fr 48px;
  gap:10px;
  align-items:center
}

.ctl label{
  font:11px/1 ui-monospace,monospace;
  letter-spacing:.1em;
  color:var(--muted);
  text-transform:uppercase
}

.ctl input{
  width:100%;
  accent-color:var(--gold)
}

.ctl output{
  font:13px/1 ui-monospace,monospace;
  color:var(--gold);
  text-align:right
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:10px
}

.actions.secondary{
  grid-template-columns:repeat(4,1fr)
}

button{
  font:inherit;
  font-size:13px;
  padding:12px 10px;
  border-radius:99px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px
}

button:hover:not(:disabled){
  border-color:var(--gold)
}

button:disabled{
  opacity:.35;
  cursor:not-allowed
}

button.go{
  border-color:var(--gold);
  background:#1e180a;
  color:var(--gold);
  font-weight:600
}

.hinher-head h2{
  margin-bottom:6px
}

.hinher-head p{
  margin:0 0 14px;
  color:var(--muted);
  font-style:italic
}

.three-col{
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr;
  gap:12px
}

.journey{
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  background:#0f120d
}

.journey.hin{
  border-color:#4a5a44
}

.journey.her{
  border-color:#6a5a2a
}

.journey.mystery-box{
  border-color:var(--gold);
  background:#1a160a
}

.journey-tag{
  font:9px/1 ui-monospace,monospace;
  letter-spacing:.18em;
  color:var(--muted)
}

.journey-tag.gold{
  color:var(--gold)
}

.journey h3{
  font-size:20px;
  font-weight:400;
  margin:10px 0 6px
}

.journey p{
  margin:0 0 10px;
  color:var(--muted);
  font-size:13px
}

.journey p strong{
  color:var(--ink)
}

.big{
  width:100%;
  padding:13px 10px;
  font-weight:700
}

.hin-btn{
  background:#1a2416;
  border-color:#4a5a44;
  color:#cfe6c8
}

.her-btn{
  background:#1e180a;
  border-color:var(--gold);
  color:var(--gold)
}

.formula{
  font:11px/1.6 ui-monospace,monospace;
  color:var(--muted);
  border-top:1px solid var(--line);
  padding-top:10px;
  margin-top:10px
}

.small{
  font-size:12px
}

.mystery-big{
  font-size:44px;
  line-height:1;
  text-align:center;
  color:var(--gold);
  padding:14px 0 8px;
  font-weight:700;
  letter-spacing:.05em
}

.toggle{
  width:100%;
  background:#0d0f0c;
  border-color:var(--gold);
  color:var(--gold);
  font-weight:700
}

.toggle.on{
  background:var(--gold);
  color:#0d0f0c
}

.reveal{
  width:100%;
  margin-top:8px;
  background:#f2efe8;
  color:#0d0f0c;
  border-color:#f2efe8;
  font-weight:700
}

.solved{
  display:flex;
  gap:6px;
  align-items:center;
  color:var(--green)!important
}

.guess{
  border-top:1px dashed #4a4a33;
  margin-top:12px;
  padding-top:10px
}

.guess>span{
  font:11px/1.4 ui-monospace,monospace;
  color:var(--muted);
  display:block;
  margin-bottom:8px
}

.guess>div{
  display:flex;
  gap:8px
}

.guess button{
  flex:1;
  padding:9px
}

.guess button.picked{
  border-color:var(--gold);
  background:#1e180a;
  color:var(--gold)
}

.levels{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:14px
}

.mini{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#0a0d08;
  transition:.3s
}

.mini.active{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(232,200,122,.18)
}

.mini-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 10px;
  font:9px/1 ui-monospace,monospace;
  letter-spacing:.12em;
  color:var(--muted)
}

.mini canvas{
  width:100%;
  height:auto;
  aspect-ratio:1
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#3a3d32
}

.active .dot{
  background:var(--gold)
}

.essence-box{
  display:flex;
  flex-direction:column
}

.essence-bars{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:10px;
  flex:1;
  align-items:end
}

.essence-bars>div{
  text-align:center
}

.bar{
  height:150px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:#0d0f0c;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden
}

.bar i{
  display:block;
  width:100%
}

.essence-bars strong{
  display:block;
  font:10px/1 ui-monospace,monospace;
  margin-top:7px;
  color:var(--ink)
}

.essence-bars span{
  font:11px/1 ui-monospace,monospace;
  color:var(--gold)
}

.stage-note{
  padding:8px 10px;
  font:11px/1 ui-monospace,monospace;
  color:var(--muted);
  border-top:1px solid var(--line)
}

.mystery-cell{
  height:100%;
  min-height:210px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:#131610
}

.mystery-cell span{
  font-size:44px;
  color:var(--gold);
  font-weight:700
}

.mystery-cell small{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.2em;
  color:var(--muted)
}

.progress{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  font:11px/1 ui-monospace,monospace;
  color:var(--muted)
}

.progress span{
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:99px
}

.progress span.done{
  border-color:var(--gold);
  color:var(--gold);
  background:#1e180a
}

.progress i{
  flex:1;
  height:1px;
  background:var(--line)
}

.progress em{
  font-style:normal
}

.hint{
  color:var(--muted);
  font-size:12px;
  margin:8px 0 0
}

.uses ol{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  counter-reset:item
}

.uses li{
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
  background:#0f120d
}

.uses li b{
  display:block;
  margin-bottom:5px;
  color:var(--gold);
  font:12px/1.4 ui-monospace,monospace;
  letter-spacing:.05em
}

.uses li span{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  display:block
}

textarea{
  width:100%;
  height:120px;
  background:#0a0d08;
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  font:11px/1.5 ui-monospace,monospace;
  resize:vertical
}

.muted{
  color:var(--muted)
}

footer{
  margin-top:20px;
  padding-top:12px;
  border-top:1px solid var(--line);
  font:10px/1.6 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  text-align:center
}

@media(max-width:820px){
  .three-col{
    grid-template-columns:1fr
  }

  .levels{
    grid-template-columns:1fr 1fr
  }

  .uses ol{
    grid-template-columns:1fr
  }

  .metrics{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:620px){
  .shell{
    padding-left:12px;
    padding-right:12px
  }

  h1{
    font-size:28px
  }

  .grid2{
    grid-template-columns:1fr
  }

  .actions,.actions.secondary{
    grid-template-columns:1fr 1fr
  }

  .levels{
    grid-template-columns:1fr 1fr
  }

  .ctl{
    grid-template-columns:64px 1fr 38px
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f0c;
    --panel:#131610;
    --line:#26281f;
    --ink:#f2efe8;
    --muted:#9a958a;
    --gold:#e8c87a
  }
}
