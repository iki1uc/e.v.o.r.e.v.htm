:root{
  --bg-deep:#08060f;
  --bg:#0f0c1a;
  --bg-mid:#1a1428;
  --surface:rgba(26,20,40,.78);
  --surface-2:rgba(0,0,0,.34);
  --border:rgba(242,201,76,.22);
  --border-strong:rgba(242,201,76,.62);
  --gold:#f2c94c;
  --gold-bright:#ffe066;
  --gold-deep:#b8860b;
  --dawn:#ff9a56;
  --ink:#f4f0e6;
  --muted:#8b8aa8;
  --green:#7ee787;
  --red:#ff7a72;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg-deep:#05040a;
    --bg:#0d0a18;
    --surface:rgba(22,17,34,.86);
    --ink:#fff7e6;
  }
}

.morning{
  --bg-deep:#1a1208;
  --bg:#2a1e14;
  --bg-mid:#3d2e1e;
  --surface:rgba(61,46,30,.82);
  --surface-2:rgba(61,46,30,.45);
  --ink:#fff5e6;
  --muted:#c4a878;
  --border:rgba(255,154,86,.28);
  --border-strong:rgba(255,154,86,.6);
}

.morning .dawn-glow{
  opacity:1
}

.dawn-glow{
  opacity:.35;
  transition:opacity .8s ease
}

.panel-active{
  border-color:var(--border-strong)!important;
  background:rgba(242,201,76,.06)!important;
  box-shadow:0 0 30px rgba(242,201,76,.12)
}

.sli-pulse{
  animation:pulseLane 1.1s ease-in-out infinite
}

.smoke{
  animation:tw 2.4s infinite alternate
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0
}

body{
  font-family:Georgia,'Palatino Linotype',Palatino,serif;
  background:var(--bg-deep);
  color:var(--ink)
}

.mono{
  font-family:'Courier New',Courier,monospace
}

button{
  font-family:'Courier New',Courier,monospace
}

@keyframes tw{
  from{
    opacity:.12;
    transform:scale(.7)
  }

  to{
    opacity:.9;
    transform:scale(1)
  }
}

@keyframes rub{
  0%,100%{
    transform:translateX(0) rotate(0)
  }

  15%{
    transform:translateX(-8px) rotate(-3deg)
  }

  30%{
    transform:translateX(8px) rotate(3deg)
  }

  45%{
    transform:translateX(-6px) rotate(-2deg)
  }

  60%{
    transform:translateX(6px) rotate(2deg)
  }

  75%{
    transform:translateX(-3px) rotate(-1deg)
  }

  90%{
    transform:translateX(3px) rotate(1deg)
  }
}

@keyframes fly{
  0%{
    opacity:1;
    transform:translate(0,0) scale(1)
  }

  100%{
    opacity:0;
    transform:translate(var(--dx),var(--dy)) scale(0)
  }
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateX(-8px)
  }

  to{
    opacity:1;
    transform:translateX(0)
  }
}

@keyframes pulseLane{
  0%,100%{
    box-shadow:0 0 0 0 rgba(242,201,76,.4)
  }

  50%{
    box-shadow:0 0 20px 4px rgba(242,201,76,.18)
  }
}

@keyframes cocoonGlow{
  0%,100%{
    opacity:.45;
    transform:scale(1)
  }

  50%{
    opacity:1;
    transform:scale(1.08)
  }
}

@keyframes beam{
  0%{
    transform:scaleY(.2);
    opacity:0
  }

  25%{
    opacity:1
  }

  100%{
    transform:scaleY(1);
    opacity:.85
  }
}

.rubbing{
  animation:rub .7s ease
}

.particle{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  pointer-events:none;
  animation:fly 1.2s ease-out forwards
}

.log-line.new{
  animation:slideIn .35s ease
}

.lane.active{
  animation:pulseLane 2.2s ease-in-out infinite
}

.cocoon-shell{
  transition:transform .9s cubic-bezier(.2,.9,.2,1), opacity .6s
}

.cocoon-open .cocoon-left{
  transform:rotate(-38deg) translate(-18px,-10px)
}

.cocoon-open .cocoon-right{
  transform:rotate(38deg) translate(18px,-10px)
}

.cocoon-beam{
  transform-origin:top center;
  animation:beam 1s ease forwards
}

.hover\:scale-\[1\.03\]:hover {
  --tw-scale-x: 1.03;
  --tw-scale-y: 1.03;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.focus\:border-\[var\(--gold\)\]:focus {
  border-color: var(--gold);
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

.disabled\:opacity-55:disabled {
  opacity: 0.55;
}

@media (min-width: 640px) {
  .sm\:flex {
    display: flex;
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1280px) {
  .xl\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
