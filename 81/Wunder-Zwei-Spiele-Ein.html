:root{
  --bg:#07080f;
  --surface:#0e1120;
  --surface2:#141830;
  --line:rgba(255,255,255,.12);
  --text:#f4f6ff;
  --muted:#a9b0c8;
  --gold:#ffd700;
  --cyan:#38c6e0;
  --pink:#ff4d6d;
  --violet:#a78bfa;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#07080f;
    --surface:#0e1120;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace
}

button{
  font:inherit
}

.shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:
 radial-gradient(700px 320px at 15% -5%, rgba(56,198,224,.18), transparent 60%),
 radial-gradient(700px 360px at 90% 0%, rgba(255,77,109,.16), transparent 60%),
 var(--bg);
  overflow-x:clip
}

.top{
  max-width:1240px;
  margin:0 auto;
  padding:clamp(22px,4vw,44px) 16px 12px;
  text-align:center
}

.wunder-logo{
  font-size:clamp(56px,11vw,124px);
  line-height:.9;
  font-weight:900;
  letter-spacing:-.06em;
  text-shadow:0 0 28px rgba(255,215,0,.35),0 0 44px rgba(56,198,224,.25);
  font-family:Impact, Haettenschweiler, "Arial Black", sans-serif
}

.wunder-logo span{
  display:inline-block;
  transform:rotate(-2deg)
}

.wunder-logo span:nth-child(2){
  transform:rotate(2deg) translateY(4px)
}

.wunder-logo span:nth-child(4){
  transform:rotate(-3deg)
}

.wunder-logo span:nth-child(6){
  transform:rotate(2deg)
}

.subtitle{
  font-size:clamp(11px,2vw,16px);
  letter-spacing:.14em;
  color:var(--gold);
  font-weight:800;
  margin:14px 0 10px
}

.header-line{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.12em
}

.header-line span{
  height:1px;
  background:var(--line);
  flex:1
}

.tabs{
  max-width:1240px;
  margin:14px auto 0;
  padding:0 16px;
  display:flex;
  gap:10px
}

.tab{
  flex:1;
  border:1px solid var(--line);
  background:#0c0f1e;
  color:#fff;
  border-radius:14px 14px 0 0;
  padding:14px 12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-weight:900;
  letter-spacing:.04em;
  font-size:clamp(12px,1.8vw,16px)
}

.tab small{
  display:none;
  font-size:10px;
  color:var(--muted);
  letter-spacing:.14em
}

.tab.active{
  background:var(--surface2);
  border-bottom:3px solid var(--gold);
  color:var(--gold);
  box-shadow:0 -10px 30px rgba(255,215,0,.08)
}

.tab-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  box-shadow:0 0 10px currentColor
}

.game-layout{
  max-width:1240px;
  margin:0 auto;
  padding:18px 16px 8px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:18px;
  align-items:start
}

.board-wrap,.stage-wrap{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  overflow:hidden
}

.board-head{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
  margin-bottom:16px
}

.eyebrow{
  font-size:11px;
  letter-spacing:.16em;
  color:var(--cyan);
  font-weight:800
}

.board-head h2{
  font-size:clamp(22px,3.4vw,34px);
  line-height:1.05;
  margin:8px 0 6px;
  font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;
  letter-spacing:.01em
}

.board-head p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:0;
  max-width:520px
}

.controls{
  display:flex;
  gap:8px;
  flex-shrink:0
}

.btn{
  border:1px solid var(--line);
  background:#171a2e;
  color:#fff;
  border-radius:999px;
  padding:10px 14px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  cursor:pointer;
  font-weight:800;
  font-size:12px
}

.btn.primary{
  background:var(--gold);
  color:#111;
  border-color:var(--gold)
}

.btn:hover{
  filter:brightness(1.15)
}

.btn:active{
  transform:translateY(1px)
}

.step-feedback{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  background:#0b0e1c;
  border:1px solid rgba(255,215,0,.35);
  color:#ffe98a;
  border-radius:10px;
  padding:9px 11px;
  font-size:11px;
  margin-bottom:12px
}

.step-feedback span{
  color:var(--muted)
}

.board-stage{
  background:#05060c;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  position:relative
}

.board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(10,1fr);
  aspect-ratio:10/18;
  max-height:560px;
  width:min(100%,360px);
  margin:0 auto;
  gap:2px;
  background:#0a0d1a;
  padding:4px;
  border:1px solid rgba(255,255,255,.08)
}

.cell{
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.025);
  border-radius:2px;
  min-width:0;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  color:#111;
  font-weight:900
}

.board-glow{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(180deg,transparent 70%,rgba(56,198,224,.08))
}

.board-caption{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:11px;
  padding:12px 4px 0
}

.seq-strip{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:14px
}

.seq-item{
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  color:var(--muted);
  background:#0b0e1c
}

.seq-item.now{
  color:#fff;
  background:#1c2140
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:14px
}

.kaiser,.next-box,.log-box,.tip-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px
}

.kaiser-top{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--gold)
}

.kaiser-top>div{
  display:flex;
  flex-direction:column;
  flex:1
}

.kaiser-top span{
  font-weight:900;
  letter-spacing:.1em;
  font-size:13px
}

.kaiser-top small{
  color:var(--muted);
  font-size:10px;
  letter-spacing:.12em
}

.live{
  background:#1d2b1d;
  color:#3dff9e;
  border:1px solid #3dff9e;
  padding:4px 7px;
  border-radius:999px;
  font-size:10px
}

.live.pink{
  background:#2b1420;
  color:#ff8aa0;
  border-color:#ff4d6d
}

.kaiser-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:16px
}

.kaiser-grid>div{
  background:#0b0e1c;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px
}

.kaiser-grid label,.fall-counter label{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.14em
}

.kaiser-grid strong{
  font-size:26px;
  line-height:1.1
}

.kaiser-grid .psnr{
  grid-column:1/-1;
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap
}

.kaiser-grid .psnr strong{
  color:var(--gold);
  font-size:30px
}

.kaiser-grid .psnr strong span{
  font-size:14px
}

.kaiser-grid .psnr small{
  color:var(--muted)
}

.psnr-bar{
  height:8px;
  background:#0b0e1c;
  border-radius:999px;
  margin-top:10px;
  overflow:hidden;
  border:1px solid var(--line)
}

.psnr-bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#38c6e0,#ffd700,#ff4d6d);
  transition:width .5s
}

.box-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:900;
  font-size:12px;
  letter-spacing:.08em;
  margin-bottom:12px
}

.next-list{
  display:flex;
  flex-direction:column;
  gap:8px
}

.next-item{
  display:grid;
  grid-template-columns:52px 54px 1fr;
  align-items:center;
  gap:10px;
  background:#0b0e1c;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px
}

.next-item.first{
  border-color:var(--gold);
  background:#1a1708
}

.next-num{
  font-size:10px;
  color:var(--muted)
}

.next-label{
  font-size:12px;
  font-weight:900
}

.mini{
  display:grid;
  gap:1px;
  justify-content:center
}

.mini span{
  display:block;
  width:9px;
  height:9px;
  border-radius:2px
}

.log{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:7px;
  max-height:220px;
  overflow:auto
}

.log li{
  font-size:11px;
  line-height:1.45;
  color:var(--muted);
  border-left:2px solid var(--line);
  padding-left:9px
}

.log li.fresh{
  color:#fff;
  border-color:var(--gold)
}

.log-count{
  margin-left:auto;
  background:#1c2140;
  padding:3px 8px;
  border-radius:999px;
  font-size:10px
}

.log-note{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  border-top:1px dashed var(--line);
  margin-top:12px;
  padding-top:10px
}

/* FALLEN */

.stage{
  position:relative;
  height:clamp(300px,44vw,430px);
  background:#070a18;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden
}

.stage-grid-bg{
  position:absolute;
  inset:0;
  background-image:linear-gradient(rgba(56,198,224,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:32px 32px
}

.stage-label-top{
  position:absolute;
  top:12px;
  left:12px;
  font-size:10px;
  letter-spacing:.18em;
  color:var(--muted)
}

.figure-holder{
  position:absolute;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  width:clamp(110px,22vw,170px);
  text-align:center;
  z-index:2
}

.figure-svg{
  width:100%;
  height:auto;
  filter:drop-shadow(0 0 18px rgba(56,198,224,.35))
}

.stage-label{
  position:absolute;
  left:50%;
  top:82%;
  transform:translateX(-50%);
  background:#07080f;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:8px 12px;
  border-radius:999px;
  font-size:clamp(10px,1.6vw,12px);
  font-weight:900;
  white-space:nowrap;
  z-index:3
}

.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:22px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.14em;
  padding:0 12px
}

.floor span{
  height:2px;
  background:var(--gold);
  flex:1
}

.floor i{
  display:block;
  width:12px;
  height:12px;
  background:var(--pink);
  transform:rotate(45deg)
}

.fall-word{
  position:absolute;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  background:var(--pink);
  color:#fff;
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:900
}

.fall-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px
}

.fall-card{
  border:1px solid var(--line);
  background:#0b0e1c;
  color:#fff;
  border-radius:12px;
  padding:13px;
  text-align:left;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:5px;
  min-height:104px
}

.fall-card:hover{
  border-color:var(--cyan);
  transform:translateY(-1px)
}

.fall-card:disabled{
  opacity:.55;
  cursor:wait
}

.fall-card strong{
  font-size:14px;
  letter-spacing:.06em
}

.fall-card>span{
  color:var(--muted);
  font-size:11px;
  line-height:1.4
}

.fall-card em{
  font-style:normal;
  color:var(--gold);
  font-size:10px;
  margin-top:auto
}

.fall-num{
  color:var(--cyan)!important;
  font-size:10px!important;
  letter-spacing:.15em
}

.status-big{
  font-size:clamp(18px,2.4vw,24px);
  font-weight:900;
  line-height:1.2;
  margin:16px 0;
  color:#fff
}

.fall-counter{
  background:#0b0e1c;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px
}

.fall-counter strong{
  font-size:36px
}

.fall-counter strong span{
  font-size:14px;
  color:var(--muted)
}

.status-note{
  color:var(--muted);
  font-size:11px;
  line-height:1.5
}

.mini-legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
  color:var(--muted);
  font-size:10px
}

.mini-legend i{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  margin-right:4px
}

.tip-box{
  border-color:var(--gold);
  background:#191503;
  color:#ffe98a;
  font-size:12px;
  line-height:1.5
}

.stage-badge{
  border:1px solid var(--pink);
  color:#ff8aa0;
  padding:8px 10px;
  border-radius:999px;
  font-size:11px;
  white-space:nowrap
}

/* Animations */

@keyframes aufsteh{
  0%{
    transform:translate(-50%,-50%) rotate(0)
  }

  35%{
    transform:translate(-50%,-12%) rotate(8deg)
  }

  60%{
    transform:translate(-50%,-55%) scaleY(.86)
  }

  100%{
    transform:translate(-50%,-50%) scaleY(1)
  }
}

@keyframes mystery{
  0%{
    opacity:1;
    transform:translate(-50%,-50%)
  }

  40%{
    opacity:0;
    transform:translate(-50%,-10%) scale(.6)
  }

  70%{
    opacity:0
  }

  100%{
    opacity:1;
    transform:translate(-50%,-50%)
  }
}

@keyframes tiefen{
  0%{
    transform:translate(-50%,-50%) scale(1)
  }

  55%{
    transform:translate(-50%,-5%) scale(.35)
  }

  100%{
    transform:translate(-50%,-50%) scale(1)
  }
}

@keyframes slide{
  0%{
    transform:translate(-50%,-50%)
  }

  30%{
    transform:translate(-10%,-25%) rotate(-12deg)
  }

  70%{
    transform:translate(-85%,-15%) rotate(10deg)
  }

  100%{
    transform:translate(-50%,-50%)
  }
}

@keyframes warb{
  0%{
    transform:translate(-50%,-50%);
    filter:hue-rotate(0)
  }

  25%{
    transform:translate(-45%,-48%) skewX(18deg);
    filter:invert(.4)
  }

  50%{
    transform:translate(-58%,-30%) skewX(-14deg)
  }

  100%{
    transform:translate(-50%,-50%)
  }
}

@keyframes transAnim{
  0%{
    transform:translate(-50%,-50%) scale(1)
  }

  40%{
    transform:translate(-50%,-15%) scale(1.25) rotate(180deg)
  }

  100%{
    transform:translate(-50%,-50%) scale(1) rotate(360deg)
  }
}

@keyframes sen{
  0%{
    transform:translate(-50%,-50%)
  }

  70%{
    transform:translate(-50%,-8%)
  }

  100%{
    transform:translate(-50%,-50%)
  }
}

@keyframes saAnim{
  0%{
    transform:translate(-50%,-50%)
  }

  45%{
    transform:translate(-50%,-28%) scale(.92)
  }

  100%{
    transform:translate(-50%,-50%)
  }
}

@keyframes tion{
  0%{
    transform:translate(-50%,-50%) rotate(0)
  }

  50%{
    transform:translate(-50%,-12%) rotate(180deg)
  }

  100%{
    transform:translate(-50%,-50%) rotate(360deg)
  }
}

@keyframes hyper{
  0%{
    transform:translate(-50%,-50%) scale(1)
  }

  30%{
    transform:translate(-50%,-5%) scale(1.35)
  }

  60%{
    transform:translate(-50%,-60%) scale(.8)
  }

  100%{
    transform:translate(-50%,-50%) scale(1)
  }
}

@keyframes einzel{
  0%{
    transform:translate(-50%,-50%)
  }

  55%{
    transform:translate(-50%,-10%) scale(.45)
  }

  100%{
    transform:translate(-50%,-50%) scale(1)
  }
}

.anim-aufsteh{
  animation:aufsteh 1.4s ease
}

.anim-mystery{
  animation:mystery 1.4s ease
}

.anim-tiefen{
  animation:tiefen 1.4s ease
}

.anim-slide{
  animation:slide 1.4s ease
}

.anim-warb{
  animation:warb 1.4s ease
}

.anim-trans{
  animation:transAnim 1.4s ease
}

.anim-sen{
  animation:sen 1.4s ease
}

.anim-sa{
  animation:saAnim 1.4s ease
}

.anim-tion{
  animation:tion 1.4s ease
}

.anim-hyper{
  animation:hyper 1.4s ease
}

.anim-einzel{
  animation:einzel 1.4s ease
}

/* Rules + footer */

.rules{
  max-width:1240px;
  margin:18px auto;
  padding:0 16px 10px
}

.rules-head{
  display:flex;
  align-items:baseline;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:14px
}

.rules-head>span{
  color:var(--gold);
  font-weight:900;
  letter-spacing:.14em;
  font-size:12px
}

.rules-head h2{
  font-size:clamp(24px,3.6vw,36px);
  margin:0;
  font-family:Impact,Haettenschweiler,"Arial Black",sans-serif
}

.rules ol{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.rules li{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:14px;
  padding:16px;
  display:flex;
  gap:12px
}

.rules li>b{
  color:var(--cyan);
  font-size:22px
}

.rules li p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.55
}

.rules li p strong{
  color:#fff
}

.footer{
  max-width:1240px;
  margin:24px auto 0;
  padding:26px 16px 40px;
  text-align:center;
  border-top:1px solid var(--line)
}

.footer p{
  letter-spacing:.18em;
  font-size:11px;
  color:var(--muted);
  margin:0 0 16px
}

.wunder-btn{
  border:3px solid #fff3a6;
  background:linear-gradient(180deg,#ffe44d,#ffb700);
  color:#1a1200;
  border-radius:999px;
  padding:18px 34px;
  font-size:clamp(20px,4vw,30px);
  font-weight:900;
  letter-spacing:.04em;
  cursor:pointer;
  box-shadow:0 0 0 4px rgba(255,215,0,.18),0 14px 44px rgba(255,183,0,.35);
  display:inline-flex;
  align-items:center;
  gap:12px
}

.wunder-btn:hover{
  transform:translateY(-2px) scale(1.02);
  filter:brightness(1.05)
}

.wunder-btn:active{
  transform:scale(.98)
}

.footer span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:14px
}

.flash-overlay{
  position:fixed;
  inset:0;
  z-index:60;
  background:radial-gradient(circle,#fff8c0,#ffd700 55%,#ff4d6d);
  display:grid;
  place-items:center;
  font-size:clamp(34px,8vw,72px);
  font-weight:900;
  color:#111;
  animation:flashOut .9s forwards
}

@keyframes flashOut{
  0%{
    opacity:1
  }

  100%{
    opacity:0;
    visibility:hidden
  }
}

.particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:61;
  overflow:hidden
}

.particles i{
  position:absolute;
  left:var(--px);
  top:48%;
  width:9px;
  height:9px;
  border-radius:50%;
  animation:burst .9s ease-out forwards
}

@keyframes burst{
  to{
    transform:translate(calc(cos(var(--r)) * var(--d)), calc(sin(var(--r)) * var(--d))) scale(.2);
    opacity:0
  }
}

@media (max-width:900px){
  .game-layout{
    grid-template-columns:1fr
  }

  .sidebar{
    order:2
  }

  .board-head{
    flex-direction:column
  }

  .controls{
    width:100%
  }

  .controls .btn{
    flex:1;
    justify-content:center
  }

  .fall-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .rules ol{
    grid-template-columns:1fr 1fr
  }

  .tabs{
    flex-direction:column
  }

  .tab{
    border-radius:12px
  }

  .tab small{
    display:inline
  }

  .board{
    width:min(100%,340px)
  }
}

@media (max-width:520px){
  .fall-grid{
    grid-template-columns:1fr
  }

  .rules ol{
    grid-template-columns:1fr
  }

  .board-caption{
    flex-direction:column;
    gap:4px
  }

  .header-line{
    font-size:9px
  }

  .stage-label{
    font-size:10px;
    padding:7px 9px
  }

  .kaiser-grid{
    grid-template-columns:1fr 1fr
  }

  .wunder-btn{
    padding:16px 22px
  }
}
