.text-\[var\(--fire\)\] {
  color: var(--fire);
}

.text-\[var\(--gold\)\] {
  color: var(--gold);
}

.text-\[var\(--ice\)\] {
  color: var(--ice);
}

.text-\[var\(--muted\)\] {
  color: var(--muted);
}

.text-\[var\(--text\)\] {
  color: var(--text);
}

.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.opacity-70 {
  opacity: 0.7;
}

.blur-2xl {
  --tw-blur: blur(40px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#070913;
  --surface:#111527;
  --surface-2:#191e35;
  --line:#2b3358;
  --text:#f5f3ff;
  --muted:#a7aecf;
  --ice:#38d6ff;
  --fire:#ff4d2e;
  --gold:#ffd34d;
  --mint:#4df0a7;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#05060d;
    --surface:#0d1021;
    --surface-2:#161b31;
    --line:#2b3358;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:"Space Grotesk", system-ui, sans-serif;
}

.font-display{
  font-family:"Bricolage Grotesque", "Space Grotesk", sans-serif;
}

@keyframes blink{
  0%,91%,100%{
    transform:scaleY(1);
  }

  94%{
    transform:scaleY(.08);
  }
}

@keyframes brainPulse{
  0%,100%{
    transform:scale(1) rotate(-2deg);
  }

  50%{
    transform:scale(1.08) rotate(2deg);
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg);
  }
}

@keyframes orbit{
  to{
    transform:rotate(360deg) translateX(56px) rotate(-360deg);
  }
}

@keyframes orbit2{
  to{
    transform:rotate(-360deg) translateX(68px) rotate(360deg);
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-7px);
  }
}

@keyframes particleFly{
  to{
    opacity:0;
    transform:translate(var(--dx), var(--dy)) scale(.1) rotate(180deg);
  }
}

@keyframes shimmer{
  0%{
    background-position:0% 50%;
  }

  100%{
    background-position:200% 50%;
  }
}

.eye-blink{
  animation:blink 4.2s ease-in-out infinite;
  transform-origin:center;
}

.brain-open{
  animation:brainPulse 1.8s ease-in-out infinite;
  filter:drop-shadow(0 0 24px rgba(255,211,77,.45));
}

.brain-closed{
  filter:grayscale(1) brightness(.55);
}

.whirl{
  animation:spinSlow linear infinite;
}

.orbit{
  animation:orbit linear infinite;
}

.orbit-rev{
  animation:orbit2 linear infinite;
}

.floaty{
  animation:floaty 3s ease-in-out infinite;
}

.particle{
  animation:particleFly 1.15s ease-out forwards;
}

.range{
  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  height:10px;
  border-radius:999px;
  outline:none;
  cursor:pointer;
}

.range::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#fff;
  border:4px solid #111527;
  box-shadow:0 0 0 2px #fff, 0 8px 22px rgba(0,0,0,.5);
}

.range::-moz-range-thumb{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  border:4px solid #111527;
}

.range:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.log-scroll::-webkit-scrollbar{
  width:5px;
}

.log-scroll::-webkit-scrollbar-thumb{
  background:#303a68;
  border-radius:99px;
}

.last\:border-0:last-child {
  border-width: 0px;
}

.hover\:-translate-y-0\.5:hover {
  --tw-translate-y: -0.125rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

@media (min-width: 640px) {
  .sm\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .sm\:h-\[190px\] {
    height: 190px;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:pt-6 {
    padding-top: 1.5rem;
  }

  .sm\:text-\[132px\] {
    font-size: 132px;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1fr_1\.25fr_1fr\] {
    grid-template-columns: 1fr 1.25fr 1fr;
  }
}

@media (min-width: 1024px) {
  .lg\:col-span-1 {
    grid-column: span 1 / span 1;
  }

  .lg\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
