:root{
  --bg:#0b0608;
  --surface:#171015;
  --surface2:#22181e;
  --line:#3a2530;
  --text:#fff7f2;
  --muted:#d8c2c8;
  --volcano:#ff3d00;
  --volcano2:#ff7a00;
  --violet:#a855f7;
  --cyan:#22d3ee;
  --gold:#fbbf24;
  --green:#4ade80;
  --earth:#8b5a2b;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Trebuchet MS",Verdana,sans-serif
}

button,input,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  background:var(--bg);
  padding-top:var(--safe-area-inset-top);
  overflow-x:clip
}

.topbar{
  max-width:1080px;
  margin:0 auto;
  padding:28px 18px 14px
}

.brand-row{
  display:flex;
  gap:14px;
  align-items:flex-start
}

.crown-badge{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--gold);
  display:grid;
  place-items:center;
  color:#1a0b00;
  flex:0 0 auto
}

.eyebrow{
  letter-spacing:.22em;
  font-size:12px;
  color:var(--gold);
  margin:0 0 6px;
  font-weight:800
}

h1{
  font-family:Impact,"Arial Black",sans-serif;
  font-size:44px;
  line-height:.92;
  margin:0;
  text-transform:uppercase
}

h1 .amp{
  color:var(--cyan)
}

.flame{
  color:var(--volcano)
}

.header-sub{
  font-size:17px;
  color:var(--muted);
  margin:16px 0 10px
}

.header-pills{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.header-pills span{
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
  background:rgba(255,255,255,.04)
}

.pill-on{
  background:var(--gold);
  color:#14060a;
  font-weight:800;
  border-color:transparent
}

main{
  max-width:1080px;
  margin:0 auto;
  padding:0 18px 30px
}

section{
  margin-top:26px
}

.kicker{
  display:flex;
  align-items:center;
  gap:6px;
  letter-spacing:.14em;
  font-size:12px;
  font-weight:800;
  color:var(--cyan);
  text-transform:uppercase
}

h2{
  font-family:Impact,"Arial Black",sans-serif;
  font-size:36px;
  line-height:1.02;
  margin:10px 0
}

h2 em{
  color:var(--gold);
  font-style:normal
}

h3{
  font-family:Impact,"Arial Black",sans-serif;
  font-size:32px;
  line-height:1;
  margin:8px 0
}

.lede{
  color:var(--muted);
  font-size:17px;
  line-height:1.55;
  max-width:620px
}

.hero{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:20px;
  align-items:start
}

.view-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:18px 0
}

.view-btn,.mode-btn,.room-btn,.lvl-btn,.erm-btn,.bauer-btn,.choice,.step-row button,.land-actions button{
  min-height:64px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--surface);
  color:var(--text);
  padding:12px;
  font-weight:800;
  line-height:1.2
}

.view-btn.active,.mode-btn.active,.room-btn.active,.lvl-btn.active,.erm-btn.active{
  border-color:var(--cyan);
  background:#12333a
}

.prisma-btn.active{
  background:var(--gold);
  color:#15060a;
  border-color:transparent
}

.prisma-banner{
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:2px;
  background:var(--surface)
}

.prisma-banner.on{
  border-color:var(--gold);
  background:#2a1a2a
}

.prisma-banner strong{
  font-size:18px
}

.prisma-banner span{
  color:var(--muted);
  font-size:13px
}

.prisma-tri{
  font-size:28px;
  color:var(--gold)
}

.diagram{
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
  background:#241318
}

.diagram.prisma-active{
  border-color:var(--gold)
}

.diagram-head{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--muted);
  margin-bottom:10px
}

.level{
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
  margin-bottom:10px;
  background:rgba(255,255,255,.03)
}

.level-label{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px
}

.level-label small{
  margin-left:auto;
  letter-spacing:.14em;
  color:var(--muted);
  font-size:11px
}

.lvl-icon{
  font-size:20px
}

.outer-room{
  border:2px dashed var(--line);
  border-radius:12px;
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between
}

.inner-room{
  border:2px solid var(--lvl);
  border-radius:10px;
  padding:10px;
  min-width:132px;
  text-align:center;
  background:rgba(0,0,0,.35)
}

.room-tag{
  font-size:10px;
  letter-spacing:.12em;
  color:var(--muted)
}

.room-tag.small{
  display:block;
  margin-bottom:4px
}

.inner-dot{
  font-size:22px;
  color:var(--lvl)
}

.inner-room small{
  font-size:11px;
  line-height:1.2;
  display:block;
  color:var(--muted)
}

.stack-arrow{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-top:4px
}

.diagram-foot{
  font-size:13px;
  color:var(--muted)
}

.rainbow-line{
  display:block;
  height:6px;
  border-radius:99px;
  background:var(--gold);
  margin-top:10px
}

.switch-section,.person-section,.land-section,.game-section,.examples,.result-section{
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  background:var(--surface)
}

.section-head p:last-child{
  color:var(--muted);
  margin:0
}

.room-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:16px 0
}

.room-btn{
  display:flex;
  flex-direction:column;
  gap:4px;
  align-items:flex-start;
  text-align:left
}

.room-btn strong{
  font-size:22px
}

.room-btn.active.suite{
  background:linear-gradient(135deg,rgba(168,85,247,.3),rgba(34,211,238,.2))
}

.switch-note{
  color:var(--muted);
  margin:0
}

/* person */

.person-grid{
  display:grid;
  grid-template-columns:1.5fr .8fr;
  gap:16px;
  margin-top:16px
}

.person-controls,.person-score,.achieved-box,.land-field,.land-controls{
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  background:var(--surface2)
}

.mini-label{
  font-size:11px;
  letter-spacing:.14em;
  color:var(--muted);
  font-weight:800;
  margin:0 0 10px
}

.lvl-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}

.lvl-btn{
  display:flex;
  flex-direction:column;
  gap:2px;
  align-items:center;
  min-height:78px;
  padding:10px 6px
}

.lvl-btn span{
  font-size:22px
}

.lvl-btn small{
  color:var(--muted)
}

.evo-rev-modes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:14px 0
}

.erm-btn{
  min-height:46px
}

.slider-label{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:14px 0 6px;
  font-weight:700
}

input[type=range]{
  width:100%;
  accent-color:var(--cyan);
  height:28px
}

.step-row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:6px
}

.step-row button{
  min-height:38px;
  padding:6px 12px;
  font-size:13px
}

.step-row span{
  font-size:13px;
  color:var(--muted)
}

.formula{
  font-size:14px;
  line-height:1.5;
  color:var(--muted)
}

.levelup-btn{
  width:100%;
  min-height:56px;
  border:0;
  border-radius:14px;
  background:linear-gradient(90deg,var(--gold),var(--volcano));
  color:#1a0b00;
  font-weight:900;
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:center
}

.levelup-btn small{
  font-weight:700
}

.big-pct{
  text-align:center
}

.big-pct strong{
  font-family:Impact,"Arial Black",sans-serif;
  font-size:72px;
  line-height:1
}

.big-pct strong span{
  font-size:34px;
  color:var(--cyan)
}

.big-pct p{
  margin:0;
  font-weight:800
}

.bucket-bar{
  height:14px;
  border-radius:99px;
  background:#0a0507;
  border:1px solid var(--line);
  overflow:hidden;
  margin:10px 0
}

.bucket-bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--violet),var(--cyan),var(--gold));
  transition:width .3s
}

.bucket-bar.big{
  height:18px
}

.stage{
  font-weight:800
}

.grad-box{
  border:1px dashed var(--gold);
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  background:rgba(251,191,36,.08)
}

.grad-box span{
  font-size:13px;
  color:var(--muted)
}

.ladder{
  margin-top:16px
}

.ladder-list{
  display:grid;
  gap:8px
}

.ladder-item{
  width:100%;
  display:grid;
  grid-template-columns:44px 1fr auto auto;
  gap:10px;
  align-items:center;
  text-align:left;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface2);
  color:var(--text);
  padding:12px
}

.ladder-item.active{
  border-color:var(--gold);
  background:rgba(251,191,36,.12)
}

.ladder-icon{
  font-size:28px;
  text-align:center
}

.ladder-main{
  display:flex;
  flex-direction:column
}

.ladder-main small{
  color:var(--muted);
  font-size:12px
}

.ladder-under{
  font-size:12px;
  color:var(--muted);
  text-align:right
}

.ladder-arrow{
  font-weight:800;
  color:var(--cyan);
  font-size:13px
}

.achieved-box{
  margin-top:12px
}

.achieved-box h4{
  font-size:22px;
  margin:8px 0
}

.achieved-text{
  font-size:17px;
  line-height:1.55;
  margin:0
}

.achieved-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:14px
}

.achieved-grid div{
  display:flex;
  flex-direction:column;
  gap:6px;
  border-top:1px solid var(--line);
  padding-top:10px
}

.achieved-grid small{
  letter-spacing:.12em;
  color:var(--muted)
}

.achieved-grid span{
  font-size:14px;
  line-height:1.45
}

/* land */

.land-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:16px
}

.field{
  border:2px solid var(--green);
  border-radius:16px;
  padding:18px;
  min-height:190px;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(180deg,#1a2d18,#0e160c)
}

.field.barren{
  border-color:#6b6b6b;
  background:#1a1a1a
}

.field-emoji{
  font-size:48px
}

.potatoes{
  font-size:28px;
  line-height:1.3;
  word-break:break-all;
  max-width:100%
}

.land-rule{
  font-size:14px;
  color:var(--muted);
  line-height:1.5
}

.bauer-toggle{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.bauer-btn.active{
  background:rgba(74,222,128,.18);
  border-color:var(--green)
}

.bauer-btn.off.active{
  background:rgba(255,255,255,.08);
  border-color:#888
}

.land-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px
}

.land-actions button{
  min-height:48px
}

.land-chain{
  font-size:14px;
  line-height:1.5;
  color:var(--muted)
}

/* game */

.buckets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:16px 0
}

.bucket{
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  background:var(--surface2);
  display:flex;
  flex-direction:column;
  gap:4px
}

.bucket strong{
  font-size:26px
}

.bucket-bar.inner i{
  background:linear-gradient(90deg,var(--cyan),var(--violet))
}

.mode-pick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.mode-btn{
  display:flex;
  flex-direction:column;
  gap:4px;
  align-items:flex-start;
  text-align:left
}

.mode-btn.active.neu{
  background:linear-gradient(135deg,rgba(255,61,0,.25),rgba(251,191,36,.2))
}

.start-btn{
  width:100%;
  min-height:58px;
  border:0;
  border-radius:16px;
  background:linear-gradient(90deg,var(--volcano),var(--gold));
  color:#1a0b00;
  font-weight:900;
  margin-top:14px;
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:center
}

.start-btn.ghost{
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--line)
}

.feedback{
  border:1px solid var(--cyan);
  border-radius:12px;
  padding:12px;
  background:rgba(34,211,238,.1);
  margin:14px 0 0
}

.round-card{
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-top:14px;
  background:var(--surface2)
}

.round-head{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  letter-spacing:.1em;
  color:var(--muted)
}

.question-block{
  margin-top:16px
}

.q-label{
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:800
}

.question{
  font-size:19px;
  line-height:1.45
}

.choice-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.choice{
  display:flex;
  flex-direction:column;
  gap:4px;
  align-items:center
}

.choice small{
  font-weight:400;
  color:var(--muted)
}

.choice.picked{
  border-color:var(--gold);
  background:rgba(251,191,36,.15)
}

.choice.picked.inner{
  border-color:var(--cyan);
  background:rgba(34,211,238,.15)
}

.submit-btn{
  width:100%;
  min-height:54px;
  border:0;
  border-radius:14px;
  background:var(--cyan);
  color:#03252b;
  font-weight:900;
  margin-top:16px
}

.mini-stats{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:14px;
  color:var(--muted)
}

/* examples */

.example-card{
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  background:var(--surface2);
  margin-top:14px
}

.example-top{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.example-top button{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text)
}

.example-q{
  font-size:20px;
  line-height:1.5
}

.reveal-btn,.next-btn,.copy-btn{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:14px;
  background:var(--gold);
  color:#1a0b00;
  font-weight:900
}

.answer-box{
  border:1px solid var(--gold);
  border-radius:14px;
  padding:14px;
  background:rgba(251,191,36,.08)
}

.dots{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:14px
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  border:0;
  background:#4a3a40
}

.dot.on{
  background:var(--cyan)
}

/* result */

.result-card{
  border:2px solid var(--line);
  border-radius:20px;
  padding:20px;
  background:linear-gradient(180deg,#241318,#120a0e);
  margin-top:14px
}

.result-card.prisma{
  border-color:var(--gold);
  box-shadow:0 0 30px rgba(251,191,36,.2)
}

.result-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap
}

.badge{
  border:1px solid var(--line);
  border-radius:99px;
  padding:6px 10px;
  font-size:12px
}

.badge.on{
  background:linear-gradient(90deg,var(--violet),var(--cyan),var(--gold));
  color:#14060a;
  font-weight:900
}

.result-card h4{
  font-size:26px
}

.result-card h4 span{
  color:var(--gold)
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin:16px 0
}

.result-grid div{
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:4px
}

.result-grid small{
  color:var(--muted);
  font-size:11px
}

.result-line{
  font-weight:700;
  line-height:1.5
}

.result-hint{
  color:var(--muted);
  font-size:14px
}

.result-card textarea{
  width:100%;
  min-height:72px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0a0507;
  color:var(--text);
  padding:12px;
  resize:vertical
}

.copy-btn{
  margin-top:12px
}

.copied-note{
  color:var(--green);
  font-weight:800
}

footer{
  max-width:1080px;
  margin:0 auto;
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

@media (max-width:760px){
  .hero,.person-grid,.land-grid{
    grid-template-columns:1fr
  }

  .lvl-row{
    grid-template-columns:repeat(5,1fr)
  }

  .lvl-btn{
    font-size:12px
  }

  .choice-row,.mode-pick,.room-switch,.buckets{
    grid-template-columns:1fr
  }

  .choice-row{
    grid-template-columns:1fr
  }

  .achieved-grid,.result-grid{
    grid-template-columns:1fr 1fr
  }

  .ladder-item{
    grid-template-columns:36px 1fr;
  }

  .ladder-under,.ladder-arrow{
    display:none
  }

  .topbar{
    padding:20px 14px 10px
  }

  main{
    padding:0 14px 24px
  }

  .view-buttons{
    grid-template-columns:1fr
  }

  h1{
    font-size:44px
  }
}
</style>
