:root{
  --bg:#05080c;
  --surface:#0c1218;
  --surface2:#121a24;
  --line:#1e2b38;
  --text:#e8f0f8;
  --muted:#7d8b9a;
  --ice:#00c8ff;
  --fire:#ff4400;
  --neutral:#00e88f;
  --warn:#ffcc00;
  --danger:#ff3344;
  --signal:#ff2ea6;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,Menlo,Consolas,monospace;
  min-height:100vh
}

button{
  font:inherit;
  cursor:pointer;
  border:none;
  background:none;
  color:inherit
}

.shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(ellipse at center top,#10192a 0%,#05080c 70%);
  overflow-x:clip
}

.page{
  max-width:1180px;
  margin:0 auto;
  padding:16px 16px 42px
}

.os-bar{
  display:flex;
  flex-wrap:wrap;
  gap:6px 14px;
  align-items:center;
  background:linear-gradient(90deg,#0d1a24,#0c1218);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 12px;
  font-size:10px;
  letter-spacing:.08em;
  margin-bottom:16px
}

.os-bar .os-item{
  color:var(--muted);
  white-space:nowrap
}

.os-bar .os-item b{
  color:var(--ice);
  font-weight:900;
  letter-spacing:.15em;
  margin-right:6px;
  font-size:9px
}

.os-bar .os-item .ok{
  color:var(--neutral)
}

.os-bar .os-item .warn{
  color:var(--warn)
}

.live-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--neutral);
  box-shadow:0 0 8px var(--neutral);
  margin-right:6px;
  animation:pulse 1.4s infinite
}

@keyframes pulse{
  50%{
    opacity:.4
  }
}

.hero{
  text-align:center;
  padding:8px 0 20px
}

.eyebrow{
  display:flex;
  gap:7px;
  justify-content:center;
  align-items:center;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.28em
}

h1{
  font-size:clamp(34px,7vw,60px);
  line-height:.95;
  margin:10px 0 6px;
  font-weight:900;
  letter-spacing:.06em
}

.ice-letter{
  color:var(--ice);
  text-shadow:0 0 20px var(--ice)
}

.fire-letter{
  color:var(--fire);
  text-shadow:0 0 20px var(--fire)
}

.os{
  color:var(--text);
  opacity:.55;
  font-size:.6em
}

.hero-sub{
  color:var(--muted);
  font-size:13px
}

.hero-sub strong{
  color:var(--text)
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(255,46,166,.1);
  border:1px solid rgba(255,46,166,.35);
  color:var(--signal);
  font-size:11px;
  font-weight:900;
  letter-spacing:.1em
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-bottom:14px
}

.stat{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0
}

.stat .k{
  color:var(--muted);
  font-size:9px;
  letter-spacing:.18em
}

.stat .v{
  font-size:22px;
  font-weight:900;
  line-height:1.1
}

.stat .v.temp{
  color:var(--warn)
}

.stat .v.hp{
  color:var(--neutral)
}

.stat .v.score{
  color:var(--warn)
}

.stat .v.mode{
  font-size:14px;
  color:var(--ice);
  letter-spacing:.05em
}

.stat .v.uptime{
  font-size:14px;
  color:var(--muted);
  font-variant-numeric:tabular-nums
}

.mini-bar{
  height:4px;
  background:rgba(255,255,255,.08);
  border-radius:99px;
  overflow:hidden;
  margin-top:4px
}

.mini-bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--danger),var(--warn),var(--neutral));
  transition:width .3s
}

.arena{
  display:grid;
  grid-template-columns:1fr 220px 1fr;
  gap:12px;
  min-height:380px;
  margin-bottom:14px
}

.zone{
  border-radius:14px;
  padding:12px;
  display:flex;
  flex-direction:column
}

.ice-zone{
  background:linear-gradient(180deg,rgba(0,200,255,.1),rgba(0,150,200,.02));
  border:1px solid rgba(0,200,255,.3)
}

.fire-zone{
  background:linear-gradient(180deg,rgba(255,68,0,.1),rgba(255,136,0,.02));
  border:1px solid rgba(255,68,0,.3)
}

.zone-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:10px;
  letter-spacing:.22em;
  padding-bottom:8px
}

.ice-zone .zone-head{
  color:var(--ice);
  border-bottom:1px solid rgba(0,200,255,.2)
}

.fire-zone .zone-head{
  color:var(--fire);
  border-bottom:1px solid rgba(255,68,0,.2)
}

.zone-sub{
  color:var(--muted);
  font-size:10px;
  margin:8px 0 0
}

.cells{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin-top:8px
}

.cell{
  aspect-ratio:1;
  border-radius:4px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  transition:.3s
}

.ice-cell.on{
  background:radial-gradient(circle,rgba(0,200,255,.72),rgba(0,150,200,.2));
  border-color:var(--ice);
  box-shadow:0 0 10px rgba(0,200,255,.4)
}

.fire-cell.on{
  background:radial-gradient(circle,rgba(255,68,0,.72),rgba(255,136,0,.2));
  border-color:var(--fire);
  box-shadow:0 0 10px rgba(255,68,0,.4);
  animation:flicker .5s infinite alternate
}

@keyframes flicker{
  from{
    opacity:.78
  }

  to{
    opacity:1
  }
}

.monster-zone{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center
}

.monster{
  width:180px;
  height:180px;
  position:relative;
  animation:breathe 3s ease-in-out infinite;
  transition:filter .4s
}

@keyframes breathe{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.04)
  }
}

.monster.frozen{
  animation:none;
  filter:brightness(.6) saturate(.4) hue-rotate(180deg)
}

.monster.over{
  animation:shatter .6s forwards
}

@keyframes shatter{
  0%{
    transform:scale(1)
  }

  40%{
    transform:scale(1.15) rotate(4deg)
  }

  100%{
    transform:scale(.7) rotate(-4deg);
    opacity:.25;
    filter:grayscale(1)
  }
}

.monster-svg{
  width:100%;
  height:100%;
  filter:drop-shadow(0 0 16px currentColor)
}

.monster-shadow{
  position:absolute;
  bottom:-4px;
  left:50%;
  transform:translateX(-50%);
  width:110px;
  height:8px;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent)
}

.monster-copy{
  margin-top:12px;
  display:flex;
  flex-direction:column
}

.monster-copy b{
  font-size:13px;
  letter-spacing:.24em;
  color:var(--neutral)
}

.monster-copy span{
  font-size:10px;
  letter-spacing:.15em;
  color:var(--muted);
  margin-top:3px
}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:14px
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap
}

.panel-head h2{
  margin:0;
  font-size:11px;
  letter-spacing:.24em;
  color:var(--warn)
}

.panel-head .sub{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.08em
}

.proc-row{
  display:grid;
  grid-template-columns:52px 34px 1fr 100px 100px 1.4fr 52px;
  gap:8px;
  align-items:center;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:6px;
  cursor:pointer;
  transition:.2s;
  font-size:11px;
  width:100%;
  text-align:left
}

.proc-row:hover{
  border-color:var(--p)
}

.proc-row.active{
  border-color:var(--p);
  background:color-mix(in srgb,var(--p) 12%,var(--surface2));
  box-shadow:0 0 14px color-mix(in srgb,var(--p) 25%,transparent)
}

.proc-pid{
  color:var(--muted);
  font-size:10px
}

.proc-icon{
  font-size:17px;
  text-align:center
}

.proc-name{
  font-weight:900;
  color:var(--p);
  letter-spacing:.1em
}

.proc-role{
  color:var(--muted);
  font-size:10px;
  letter-spacing:.05em
}

.proc-state{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.08em;
  text-align:center
}

.proc-row.active .proc-state{
  color:var(--p);
  font-weight:900
}

.proc-code{
  font-family:monospace;
  font-size:10px;
  color:var(--muted);
  background:rgba(0,0,0,.35);
  padding:2px 6px;
  border-radius:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.proc-exec{
  font-family:monospace;
  font-size:11px;
  color:var(--warn);
  text-align:right;
  font-weight:900
}

.slider-row{
  display:flex;
  align-items:center;
  gap:12px
}

.slider-row label{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.18em
}

.slider-row input{
  flex:1;
  height:6px;
  border-radius:3px;
  -webkit-appearance:none;
     -moz-appearance:none;
          appearance:none;
  cursor:pointer;
  background:linear-gradient(90deg,var(--ice),var(--neutral),var(--fire));
  min-width:0
}

.slider-row input::-webkit-slider-thumb{
  -webkit-appearance:none;
          appearance:none;
  width:20px;
  height:20px;
  background:#fff;
  border-radius:50%;
  border:3px solid #0a0e13;
  box-shadow:0 0 10px rgba(255,255,255,.6)
}

.slider-row output{
  font-weight:900;
  color:var(--warn);
  min-width:50px;
  text-align:right
}

.syscall-groups{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:10px
}

.syscall-group{
  background:rgba(0,0,0,.2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px
}

.syscall-group>span{
  display:block;
  font-size:9px;
  letter-spacing:.24em;
  color:var(--ice);
  margin-bottom:8px
}

.chip-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

.chip{
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface2);
  color:var(--text);
  font-size:10px;
  letter-spacing:.08em;
  transition:.15s
}

.chip:hover{
  border-color:var(--warn);
  color:var(--warn)
}

.chip.signal{
  border-color:rgba(255,46,166,.35);
  color:var(--signal)
}

.chip.signal:hover{
  border-color:var(--signal);
  background:rgba(255,46,166,.1)
}

.chip.danger{
  border-color:rgba(255,51,68,.35);
  color:var(--danger)
}

.chip.danger:hover{
  border-color:var(--danger);
  background:rgba(255,51,68,.1)
}

.chip:disabled{
  opacity:.45;
  cursor:not-allowed
}

.keyboard-hint{
  margin-top:10px;
  font-size:10px;
  color:var(--muted);
  letter-spacing:.1em;
  text-align:center;
  padding:8px;
  background:rgba(0,0,0,.2);
  border-radius:6px
}

.log{
  max-height:150px;
  overflow-y:auto;
  background:rgba(0,0,0,.4);
  border-radius:7px;
  padding:8px;
  font-size:11px;
  line-height:1.6
}

.log-line{
  display:flex;
  gap:8px;
  color:var(--muted);
  padding:1px 0
}

.log-line time{
  flex:0 0 auto;
  color:#5b6a7a;
  font-size:10px
}

.log-line:first-child{
  color:var(--text)
}

.log-line.sys{
  color:var(--ice)
}

.log-line.puppet{
  color:#c4b5fd
}

.log-line.warn{
  color:var(--warn)
}

.log-line.err{
  color:var(--danger)
}

.log-line.ok{
  color:var(--neutral)
}

.log-line.signal{
  color:var(--signal)
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(5,8,12,.94);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
  backdrop-filter:blur(6px)
}

.overlay-card{
  background:var(--surface);
  border:2px solid var(--danger);
  border-radius:16px;
  padding:28px;
  max-width:460px;
  width:100%;
  text-align:center
}

.overlay-card .skull{
  font-size:40px
}

.overlay-card h2{
  font-size:26px;
  color:var(--danger);
  margin:6px 0 12px;
  letter-spacing:.1em
}

.overlay-card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin-bottom:20px
}

.final-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:16px 0
}

.final-stats>div{
  background:rgba(0,0,0,.3);
  border-radius:8px;
  padding:10px
}

.final-stats .k{
  font-size:9px;
  letter-spacing:.2em;
  color:var(--muted)
}

.final-stats .v{
  font-size:20px;
  font-weight:900;
  color:var(--warn);
  margin-top:2px
}

.btn-wunder{
  padding:14px 24px;
  border-radius:10px;
  font-weight:900;
  letter-spacing:.15em;
  background:linear-gradient(135deg,var(--warn),#ff9900);
  color:#1a1200;
  font-size:14px
}

.btn-wunder:hover{
  transform:translateY(-1px);
  filter:brightness(1.1)
}

.particle{
  position:fixed;
  width:8px;
  height:8px;
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  animation:fly 1.3s ease-out forwards
}

@keyframes fly{
  to{
    opacity:0;
    transform:translate(var(--dx),var(--dy)) scale(0)
  }
}

.shell.flash{
  animation:flash .8s ease-out
}

@keyframes flash{
  0%{
    box-shadow:inset 0 0 0 0 rgba(255,204,0,.8)
  }

  100%{
    box-shadow:inset 0 0 0 100vmax rgba(255,204,0,0)
  }
}

footer{
  margin-top:14px;
  text-align:center;
  font-size:10px;
  color:var(--muted);
  letter-spacing:.1em
}

@media(max-width:820px){
  .status-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .arena{
    grid-template-columns:1fr;
    min-height:0
  }

  .monster-zone{
    order:-1;
    padding:6px 0
  }

  .monster{
    width:150px;
    height:150px
  }

  .cells{
    grid-template-columns:repeat(6,1fr)
  }

  .proc-row{
    grid-template-columns:44px 28px 1fr auto 44px;
    font-size:11px
  }

  .proc-role,.proc-code{
    display:none
  }
}

@media(max-width:480px){
  .proc-row{
    grid-template-columns:40px 26px 1fr auto 40px
  }

  .panel-head{
    flex-direction:column;
    align-items:flex-start
  }

  .os-bar{
    font-size:9px
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#05080c;
    --surface:#0c1218;
    --surface2:#121a24;
    --line:#1e2b38;
    --text:#e8f0f8;
    --muted:#7d8b9a
  }
}
