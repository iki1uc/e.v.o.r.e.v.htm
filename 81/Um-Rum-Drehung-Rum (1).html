:root{
  --bg:#0a0a12;
  --surface:#14141f;
  --surface2:#1b1b2a;
  --line:#2c2c42;
  --text:#f6f1e5;
  --muted:#b9b4a8;
  --gold:#e9c46a;
  --gold2:#b98a24;
  --green:#7fb069;
  --green2:#4f9d69;
  --blue:#4f8ff7;
  --brown:#b07d4f;
  --turquoise:#3fd0c5;
  --purple:#a678e8;
  --red:#ff6b6b;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#f2eee3;
    --surface:#ffffff;
    --surface2:#ece7d8;
    --line:#d8d0ba;
    --text:#18181f;
    --muted:#5f5a4f;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-width:0
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:clip
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(circle at 50% 0%,#25253a 0,transparent 520px),var(--bg);
  overflow-x:clip
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  display:flex;
  align-items:center;
  gap:12px;
  max-width:1180px;
  margin:0 auto;
  padding:14px 18px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--line)
}

.brand-mark{
  width:40px;
  height:40px;
  border:2px solid var(--gold);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--gold);
  flex:0 0 auto
}

.eyebrow,.mini-label{
  font-family:Arial,Helvetica,sans-serif;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:800
}

.topbar h1{
  margin:0;
  font-size:22px;
  line-height:1;
  letter-spacing:.04em
}

.live{
  margin-left:auto;
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:800;
  color:var(--green);
  white-space:nowrap
}

main{
  max-width:1180px;
  margin:0 auto;
  padding:28px 18px 10px
}

.intro{
  max-width:820px;
  margin:0 auto 28px;
  text-align:center
}

.kicker{
  font-family:Arial,sans-serif;
  color:var(--muted);
  letter-spacing:.14em;
  font-size:12px;
  font-weight:700
}

.intro h2{
  font-size:clamp(38px,7vw,72px);
  line-height:.92;
  margin:14px 0;
  letter-spacing:-.04em
}

.intro h2 em{
  color:var(--gold);
  font-style:normal
}

.sub{
  color:var(--muted);
  font-size:17px;
  line-height:1.55;
  max-width:660px;
  margin:0 auto
}

.main-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:18px;
  align-items:start
}

.orbit-card,.where-card,.figure-card,.speed-card,.panel,.celle-band,.chess-band,.big-logic{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 18px 50px rgba(0,0,0,.18)
}

.orbit-card{
  padding:18px
}

.card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px
}

.card-head h3,.panel h3,.celle-band h3,.chess-band h3{
  margin:5px 0 0;
  font-size:28px;
  line-height:.95;
  letter-spacing:-.02em
}

.step-badge{
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800;
  background:var(--surface2);
  border:1px solid var(--line);
  padding:8px 10px;
  border-radius:999px;
  white-space:nowrap
}

.orbit-wrap{
  position:relative;
  width:min(100%,380px);
  aspect-ratio:1;
  margin:16px auto 8px
}

.orbit{
  position:absolute;
  inset:0
}

.ring{
  position:absolute;
  left:50%;
  top:50%;
  translate:-50% -50%;
  border:1.5px dashed;
  border-radius:50%
}

.ring-name{
  position:absolute;
  top:6px;
  left:50%;
  translate:-50% 0;
  font-family:Arial,sans-serif;
  font-size:9px;
  font-weight:900;
  letter-spacing:.12em
}

.ring-dot{
  position:absolute;
  left:50%;
  top:50%;
  width:12px;
  height:12px;
  border-radius:50%;
  box-shadow:0 0 0 3px var(--surface);
  transition:transform var(--dur, .65s) cubic-bezier(.2,.9,.2,1)
}

.center-figure{
  position:absolute;
  left:50%;
  top:50%;
  translate:-50% -50%;
  width:96px;
  height:96px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe89a,var(--gold) 55%,var(--gold2));
  color:#241a03;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:3;
  border:4px solid #fff2b8;
  box-shadow:0 0 0 6px #3a2d08,0 10px 30px rgba(0,0,0,.35);
  text-align:center
}

.center-figure strong{
  font-size:18px;
  line-height:1
}

.center-figure span{
  font-family:Arial,sans-serif;
  font-size:9px;
  font-weight:900;
  letter-spacing:.15em
}

.needle{
  position:absolute;
  left:50%;
  top:50%;
  width:3px;
  height:158px;
  margin:-158px 0 0 -1px;
  background:linear-gradient(var(--gold),transparent);
  transform-origin:50% 100%;
  transition:transform var(--dur,.65s);
  z-index:1;
  opacity:.65
}

.needle span{
  position:absolute;
  top:-4px;
  left:-4px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--gold)
}

.orbit-labels span{
  position:absolute;
  translate:-50% 0;
  font-family:Arial,sans-serif;
  font-size:10px;
  font-weight:900;
  letter-spacing:.1em;
  color:var(--muted);
  z-index:2
}

.big-turn{
  width:100%;
  border:0;
  border-radius:16px;
  background:var(--gold);
  color:#211703;
  padding:18px;
  font-family:Arial,sans-serif;
  font-weight:900;
  font-size:20px;
  letter-spacing:.06em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 8px 0 #7a5c0f;
  transition:.15s
}

.big-turn:active{
  transform:translateY(4px);
  box-shadow:0 3px 0 #7a5c0f
}

.controls-row{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap
}

.pill,.speed-btn,.fig-btn{
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  border-radius:999px;
  padding:9px 12px;
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:6px
}

.pill.active,.speed-btn.active,.fig-btn.active{
  background:var(--gold);
  color:#211703;
  border-color:var(--gold)
}

.action-note{
  color:var(--muted);
  font-size:14px;
  text-align:center;
  margin:12px 0 0
}

.side-stack{
  display:grid;
  gap:16px
}

.where-card{
  padding:20px;
  background:linear-gradient(145deg,var(--surface),#1f2938);
  border-color:var(--blue)
}

.where-top{
  display:flex;
  gap:8px;
  align-items:center;
  color:var(--blue);
  font-family:Arial,sans-serif;
  font-weight:800;
  font-size:13px
}

.where-place{
  font-size:52px;
  line-height:1;
  margin:12px 0;
  letter-spacing:-.03em
}

.where-card p{
  line-height:1.5;
  color:var(--muted);
  margin:8px 0
}

.hint{
  color:var(--text)!important
}

.sequence{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:14px
}

.seq{
  font-family:Arial,sans-serif;
  font-size:10px;
  font-weight:800;
  padding:6px 7px;
  border-radius:999px;
  background:var(--surface2);
  color:var(--muted)
}

.seq.active{
  background:var(--blue);
  color:white
}

.figure-card,.speed-card{
  padding:18px
}

.figure-card label,.speed-head{
  font-family:Arial,sans-serif;
  font-weight:800;
  font-size:14px
}

.figure-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin:13px 0
}

.fig-btn{
  justify-content:center;
  padding:11px
}

.gold-dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--gold);
  margin-right:6px
}

.figure-card p,.speed-card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.speed-head{
  display:flex;
  align-items:center;
  gap:8px
}

.speed-head strong{
  margin-left:auto;
  color:var(--gold);
  text-transform:uppercase
}

.speed-card input{
  width:100%;
  accent-color:var(--gold);
  margin:16px 0 6px
}

.speed-labels{
  display:flex;
  justify-content:space-between;
  font-family:Arial,sans-serif;
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  font-weight:800
}

.speed-buttons{
  display:flex;
  gap:7px;
  margin-top:12px;
  flex-wrap:wrap
}

.logic{
  border-top:1px dashed var(--line);
  padding-top:13px;
  margin-top:16px!important;
  color:var(--text)!important;
  font-size:16px!important;
  line-height:1.6!important
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:18px
}

.panel{
  padding:22px;
  overflow:hidden
}

.panel-kicker{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--green);
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.1em
}

.tower-panel .panel-kicker{
  color:var(--purple)
}

.panel p{
  color:var(--muted);
  line-height:1.5
}

.garden-orbit,.tower-orbit{
  position:relative;
  width:270px;
  height:270px;
  margin:18px auto;
  border:2px dashed var(--green);
  border-radius:50%;
  max-width:100%
}

.tower-orbit{
  border-color:var(--purple)
}

.garden-ring{
  position:absolute;
  inset:0;
  transition:transform var(--dur,.65s) cubic-bezier(.2,.9,.2,1)
}

.garden-item{
  position:absolute;
  left:50%;
  top:50%;
  width:64px;
  margin:-20px 0 0 -32px;
  padding:10px 4px;
  text-align:center;
  border-radius:999px;
  background:var(--green);
  color:#10230e;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:900;
  transition:transform var(--dur,.65s)
}

.garden-center{
  position:absolute;
  left:50%;
  top:50%;
  translate:-50% -50%;
  width:88px;
  height:88px;
  border-radius:50%;
  background:#23452a;
  color:#d8ffd0;
  display:grid;
  place-content:center;
  text-align:center;
  font-weight:900
}

.garden-center small{
  font-family:Arial,sans-serif;
  font-size:10px
}

.ccw{
  position:absolute;
  bottom:14px;
  left:50%;
  translate:-50% 0;
  font-family:Arial,sans-serif;
  font-size:10px;
  color:var(--green);
  font-weight:800
}

.turn{
  border:0;
  border-radius:14px;
  padding:15px 18px;
  font-family:Arial,sans-serif;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%
}

.turn.green{
  background:var(--green);
  color:#10230e
}

.turn.purple{
  background:var(--purple);
  color:#1a0b2e
}

.turn.gold{
  background:var(--gold);
  color:#211703
}

.turn.small{
  margin-top:12px
}

.panel-foot{
  font-size:13px;
  text-align:center
}

.city-core{
  position:absolute;
  left:50%;
  top:50%;
  translate:-50% -50%;
  width:92px;
  height:92px;
  border-radius:50%;
  background:var(--blue);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}

.city-core strong{
  font-family:Arial,sans-serif;
  font-size:14px
}

.city-core span{
  font-size:10px
}

.tower{
  position:absolute;
  left:50%;
  top:50%;
  width:104px;
  margin:-32px 0 0 -52px;
  border-radius:14px;
  padding:9px 5px;
  text-align:center;
  transition:transform var(--dur,.65s) cubic-bezier(.2,.9,.2,1);
  font-family:Arial,sans-serif;
  z-index:2
}

.tower strong{
  display:block;
  font-size:11px
}

.tower small{
  font-size:10px;
  opacity:.8
}

.tower-icon{
  display:block;
  font-size:18px
}

.minaret{
  background:var(--turquoise);
  color:#032723
}

.cathedral{
  background:var(--purple);
  color:#1d0b36
}

.top-marker{
  position:absolute;
  top:-10px;
  left:50%;
  translate:-50% 0;
  background:var(--gold);
  color:#211703;
  font-family:Arial,sans-serif;
  font-size:10px;
  font-weight:900;
  padding:4px 8px;
  border-radius:999px
}

.meeting{
  border:2px solid var(--gold);
  background:#3a2d08;
  color:#ffe89a;
  border-radius:16px;
  padding:13px;
  text-align:center;
  margin:14px 0
}

.meeting p{
  margin:4px 0 0;
  color:#ffe89a
}

.meeting.soft{
  border-color:var(--purple);
  background:#251733;
  color:#e5d4ff
}

.meeting.soft p{
  color:#e5d4ff
}

.meeting.ghost{
  border-style:dashed;
  border-color:var(--line);
  background:transparent;
  color:var(--muted)
}

.meeting.ghost p{
  color:var(--muted)
}

.celle-band,.chess-band{
  margin-top:18px;
  padding:22px;
  display:grid;
  grid-template-columns:1.2fr .8fr auto;
  gap:20px;
  align-items:center
}

.celle-band p,.chess-band p{
  color:var(--muted);
  line-height:1.5
}

.celle-band h3 em,.chess-band h3 em{
  color:var(--gold);
  font-style:normal
}

.celle-orbit,.chess-orbit{
  position:relative;
  width:180px;
  height:180px;
  border:2px dashed var(--brown);
  border-radius:50%;
  margin:auto;
  flex:0 0 auto
}

.celle-dot,.chess-piece{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  margin:-19px 0 0 -31px;
  border-radius:999px;
  padding:10px 4px;
  text-align:center;
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:900;
  transition:transform var(--dur,.65s)
}

.celle-dot.feld{
  background:var(--green);
  color:#10230e
}

.celle-dot.celle{
  background:var(--blue);
  color:white
}

.celle-core,.chess-core{
  position:absolute;
  left:50%;
  top:50%;
  translate:-50% -50%;
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--gold);
  color:#211703;
  display:grid;
  place-content:center;
  font-family:Arial,sans-serif;
  font-weight:900;
  font-size:12px
}

.chess-band{
  border-color:#8d6b1f;
  background:linear-gradient(120deg,var(--surface),#2a230f)
}

.chess-orbit{
  border-color:var(--gold);
  width:200px;
  height:200px
}

.chess-legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 16px;
  margin-top:12px;
  font-family:Arial,sans-serif;
  font-size:12px;
  color:var(--muted)
}

.chess-legend b{
  font-size:18px;
  line-height:1
}

.dot.gold{
  color:var(--gold)
}

.chess-piece{
  background:#f7e7a6;
  color:#211703;
  border:2px solid var(--gold);
  display:flex;
  flex-direction:column;
  gap:1px;
  line-height:1
}

.chess-glyph{
  font-size:24px
}

.chess-core{
  text-align:center;
  line-height:1.1
}

.chess-core small{
  font-size:9px
}

.chess-actions{
  display:grid;
  gap:8px;
  justify-items:stretch
}

.chess-actions p{
  margin:0;
  text-align:center;
  font-size:13px
}

.mystery-band{
  margin-top:18px;
  padding:22px;
  display:grid;
  grid-template-columns:1.2fr .8fr auto;
  gap:20px;
  align-items:center;
  background:linear-gradient(120deg,#17121f,var(--surface));
  border:1px solid #4a3568;
  border-radius:24px;
  box-shadow:0 18px 50px rgba(0,0,0,.18)
}

.mystery-band p{
  color:var(--muted);
  line-height:1.5
}

.mystery-band h3{
  margin:5px 0 0;
  font-size:28px;
  line-height:.95
}

.mystery-band h3 em{
  color:#c9a6ff;
  font-style:normal
}

.mystery-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin-top:14px;
  font-family:Arial,sans-serif;
  font-size:13px;
  color:var(--muted)
}

.mystery-meta span{
  display:inline-flex;
  align-items:center;
  gap:6px
}

.mystery-meta b{
  color:var(--text)
}

.mystery-toggle{
  margin-top:14px;
  border:1px solid #7d5fc0;
  background:transparent;
  color:var(--text);
  border-radius:999px;
  padding:9px 14px;
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:800
}

.mystery-toggle.on{
  background:#c9a6ff;
  color:#221236;
  border-color:#c9a6ff
}

.mystery-orbit{
  position:relative;
  width:200px;
  height:200px;
  border:2px dashed #7d5fc0;
  border-radius:50%;
  margin:auto;
  flex:0 0 auto
}

.mystery-mask{
  position:absolute;
  left:50%;
  top:50%;
  width:78px;
  margin:-27px 0 0 -39px;
  border-radius:16px;
  padding:8px 4px;
  text-align:center;
  background:#e8e2f7;
  color:#221236;
  font-family:Arial,sans-serif;
  font-size:10px;
  font-weight:900;
  transition:transform var(--dur,.65s);
  z-index:2
}

.mask-face{
  display:block;
  font-size:20px;
  line-height:1
}

.mystery-ghost{
  position:absolute;
  left:50%;
  top:50%;
  width:38px;
  height:38px;
  margin:-19px 0 0 -19px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#3a2d58;
  color:#c9a6ff;
  font-weight:900;
  transition:transform var(--dur,.65s)
}

.mystery-core{
  position:absolute;
  left:50%;
  top:50%;
  translate:-50% -50%;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#221236;
  color:#c9a6ff;
  display:grid;
  place-content:center;
  text-align:center;
  font-family:Arial,sans-serif;
  font-weight:900;
  border:2px solid #7d5fc0
}

.mystery-core small{
  font-size:8px
}

.laugh-bubble{
  position:absolute;
  top:2px;
  right:-8px;
  z-index:4;
  background:var(--gold);
  color:#211703;
  border-radius:14px 14px 14px 2px;
  padding:7px 9px;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:900;
  max-width:130px
}

.mystery-actions{
  display:grid;
  gap:8px
}

.mystery-actions p{
  margin:0;
  text-align:center;
  font-size:13px
}

.turn.mystery-btn{
  background:#c9a6ff;
  color:#221236
}

.big-logic{
  margin-top:18px;
  padding:32px;
  text-align:center;
  background:linear-gradient(120deg,#191a2b,var(--surface))
}

.big-logic p{
  font-size:clamp(28px,5vw,52px);
  line-height:1.08;
  margin:16px auto;
  max-width:900px
}

.big-logic p span{
  color:var(--gold)
}

.logic-chips{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap
}

.logic-chips span{
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800;
  border:1px solid var(--line);
  padding:8px 12px;
  border-radius:999px
}

footer{
  max-width:1180px;
  margin:28px auto 0;
  padding:20px 18px 30px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  font-family:Arial,sans-serif;
  font-size:12px;
  color:var(--muted)
}

footer strong{
  color:var(--text)
}

@media(max-width:760px){
  .main-grid,.two-col{
    grid-template-columns:1fr
  }

  .topbar h1{
    font-size:18px
  }

  .live{
    display:none
  }

  .celle-band,.chess-band,.mystery-band{
    grid-template-columns:1fr;
    text-align:center
  }

  .celle-band .turn,.chess-band .turn,.mystery-band .turn{
    max-width:340px;
    margin-left:auto;
    margin-right:auto
  }

  .mystery-meta,.mystery-toggle{
    justify-content:center
  }

  .mystery-meta{
    justify-content:center
  }

  .garden-orbit,.tower-orbit{
    width:250px;
    height:250px
  }

  .where-place{
    font-size:44px
  }

  footer{
    justify-content:center;
    text-align:center
  }
}

@media(max-width:420px){
  main{
    padding-left:12px;
    padding-right:12px
  }

  .orbit-card,.panel,.celle-band,.chess-band,.big-logic{
    padding:16px
  }

  .garden-orbit,.tower-orbit{
    width:235px;
    height:235px
  }

  .card-head{
    align-items:flex-start
  }

  .step-badge{
    font-size:10px;
    padding:6px 8px
  }
}

@media (prefers-reduced-motion:reduce){
  *{
    transition:none!important
  }
}
