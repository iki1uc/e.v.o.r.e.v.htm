:root{
  --bg:#05060c;
  --surface:#0a0d17;
  --panel:rgba(10,14,24,.72);
  --line:rgba(0,204,255,.14);
  --line2:rgba(0,204,255,.28);
  --txt:#d7dee9;
  --dim:#8b96a8;
  --faint:#536174;
  --gold:#ffd700;
  --cyan:#00ccff;
  --pink:#ff66ff;
  --green:#00ff88;
  --red:#ff5555;
  --sans:"Space Grotesk", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#05060c;
    --surface:#0a0d17;
    --panel:rgba(10,14,24,.72);
    --txt:#d7dee9;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:radial-gradient(ellipse 120% 80% at 50% 0%, #10132b 0%, #0a0a18 38%, #000 100%);
  color:var(--txt);
  font-family:var(--mono);
  overflow-x:clip
}

button,input,textarea{
  font-family:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  width:100%;
  padding:0 14px 28px;
  overflow-x:clip
}

.page{
  max-width:1440px;
  margin:0 auto
}

.hero{
  padding:30px 2px 20px;
  text-align:center;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  font-size:10px;
  letter-spacing:3px;
  color:var(--cyan);
  display:flex;
  justify-content:center;
  gap:8px;
  align-items:center
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
  display:inline-block
}

.hero h1{
  font-family:var(--sans);
  font-size:clamp(36px,7vw,88px);
  line-height:.9;
  letter-spacing:-2px;
  font-weight:300;
  margin:16px 0 12px
}

.hero h1 .or{
  font-size:.42em;
  color:var(--gold);
  vertical-align:middle;
  letter-spacing:5px;
  padding:0 10px
}

.hero>p{
  color:var(--dim);
  font-size:13px;
  max-width:760px;
  margin:0 auto;
  line-height:1.6
}

.hero-meta{
  margin-top:16px;
  font-size:10px;
  letter-spacing:1.5px;
  color:var(--dim);
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px
}

.hero-meta b{
  color:var(--gold);
  font-weight:600
}

.hero-meta i{
  color:var(--faint);
  font-style:normal
}

.counters{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:var(--gap,12px);
  margin:18px 0
}

.counter{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:14px;
  padding:16px;
  box-shadow:0 0 var(--glow,8px) rgba(0,204,255,.05)
}

.counter strong{
  display:block;
  font-size:38px;
  line-height:1;
  font-variant-numeric:tabular-nums
}

.counter span{
  display:block;
  margin-top:8px;
  font-size:10px;
  letter-spacing:2px;
  font-weight:700
}

.counter small{
  color:var(--dim);
  font-size:10px
}

.counter.green strong,.counter.green span{
  color:var(--green)
}

.counter.pink strong,.counter.pink span{
  color:var(--pink)
}

.counter.cyan strong,.counter.cyan span{
  color:var(--cyan)
}

.counter.total strong{
  color:var(--gold)
}

.counter.total span{
  color:var(--gold)
}

.progress{
  grid-column:1/-1;
  border:1px solid var(--line);
  background:rgba(0,0,0,.28);
  border-radius:14px;
  padding:14px 16px
}

.progress-row{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:1.5px;
  color:var(--dim)
}

.progress-row b{
  color:var(--txt)
}

.progress .bar{
  height:5px;
  background:#172034;
  border-radius:99px;
  margin:10px 0;
  overflow:hidden
}

.progress .bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--green),var(--gold));
  transition:width .3s
}

.progress>span{
  font-size:10px;
  color:var(--faint)
}

.notice{
  border:1px solid rgba(255,215,0,.28);
  background:rgba(255,215,0,.08);
  color:var(--gold);
  border-radius:10px;
  padding:10px 13px;
  display:flex;
  gap:8px;
  align-items:center;
  font-size:12px;
  margin-bottom:16px
}

.toolbar{
  border:1px solid var(--line);
  background:rgba(0,0,0,.22);
  padding:14px;
  border-radius:14px
}

.filter-group{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

.filter-group.status{
  margin-top:8px;
  padding-top:10px;
  border-top:1px solid var(--line)
}

.chip{
  border:1px solid var(--line2);
  background:rgba(255,255,255,.03);
  color:var(--dim);
  padding:7px 13px;
  border-radius:999px;
  font-size:10px;
  letter-spacing:1px
}

.chip:hover{
  color:#fff
}

.chip.active{
  background:rgba(255,215,0,.13);
  color:var(--gold);
  border-color:rgba(255,215,0,.35)
}

.chip.small{
  font-size:9px;
  padding:6px 10px
}

.chip.small.active{
  background:rgba(0,204,255,.12);
  color:var(--cyan);
  border-color:rgba(0,204,255,.35)
}

.result-line{
  margin-top:11px;
  font-size:10px;
  color:var(--dim);
  letter-spacing:1px
}

.result-line b{
  color:var(--txt);
  font-size:12px
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:var(--gap,12px);
  margin-top:var(--gap,12px)
}

.card{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:14px;
  padding:16px;
  transition:transform .18s,border-color .18s,box-shadow .18s
}

.card:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:var(--ac);
  opacity:.55
}

.card:hover{
  transform:translateY(-2px);
  border-color:var(--line2)
}

.card.recycelt{
  border-color:rgba(0,255,136,.3);
  box-shadow:0 0 var(--glow,8px) rgba(0,255,136,.08)
}

.card.weg{
  border-color:rgba(255,102,255,.28);
  opacity:.9
}

.card.halten{
  border-color:rgba(0,204,255,.3)
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center
}

.category{
  font-size:8px;
  letter-spacing:2px;
  color:var(--faint)
}

.state{
  font-size:8px;
  letter-spacing:1px;
  padding:4px 7px;
  border-radius:99px
}

.state-recycelt{
  color:var(--green);
  background:rgba(0,255,136,.1)
}

.state-weg{
  color:var(--pink);
  background:rgba(255,102,255,.1)
}

.state-halten{
  color:var(--cyan);
  background:rgba(0,204,255,.1)
}

.card h2{
  font-family:var(--sans);
  font-size:22px;
  line-height:1.1;
  margin:11px 0 5px;
  color:var(--ac)
}

.card p{
  font-size:11px;
  line-height:1.55;
  color:var(--dim);
  min-height:34px;
  margin:0
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-top:14px
}

.action{
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:var(--dim);
  border-radius:9px;
  padding:9px 4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  min-width:0
}

.action span{
  font-size:8px;
  font-weight:800;
  letter-spacing:.5px
}

.action small{
  font-size:8px;
  color:var(--faint);
  text-align:center
}

.action:hover{
  color:var(--txt);
  transform:translateY(-1px)
}

.action.recycle.selected{
  background:rgba(0,255,136,.14);
  color:var(--green);
  border-color:rgba(0,255,136,.4)
}

.action.discard.selected{
  background:rgba(255,102,255,.14);
  color:var(--pink);
  border-color:rgba(255,102,255,.4)
}

.action.hold.selected{
  background:rgba(0,204,255,.14);
  color:var(--cyan);
  border-color:rgba(0,204,255,.4)
}

.empty{
  padding:36px;
  text-align:center;
  border:1px dashed var(--line2);
  border-radius:14px;
  color:var(--dim);
  margin-top:14px
}

.empty button{
  background:none;
  border:0;
  color:var(--cyan);
  text-decoration:underline
}

.control-deck{
  margin-top:18px;
  border:1px solid rgba(255,215,0,.22);
  background:rgba(0,0,0,.3);
  border-radius:16px;
  padding:18px;
  box-shadow:0 0 var(--glow,8px) rgba(255,215,0,.06)
}

.control-head{
  display:flex;
  gap:12px;
  align-items:center;
  color:var(--gold)
}

.control-head>div{
  flex:1
}

.control-head h2{
  font-size:12px;
  letter-spacing:2px;
  margin:0
}

.control-head p{
  font-size:10px;
  color:var(--dim);
  margin:4px 0 0
}

.reset{
  border:1px solid var(--line2);
  background:transparent;
  color:var(--dim);
  border-radius:999px;
  padding:8px 11px;
  display:flex;
  gap:6px;
  align-items:center;
  font-size:10px
}

.sliders{
  display:grid;
  gap:18px;
  margin:20px 0
}

.sliders label>span:first-child{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:1.5px
}

.sliders label b{
  color:var(--green)
}

.sliders label strong{
  color:var(--green);
  font-size:15px
}

.sliders input{
  width:100%;
  accent-color:var(--green);
  height:24px
}

.scale{
  display:flex;
  justify-content:space-between;
  font-size:8px;
  color:var(--faint)
}

.export-button{
  width:100%;
  border:1px solid rgba(0,255,136,.35);
  background:rgba(0,255,136,.1);
  color:var(--green);
  padding:14px;
  border-radius:999px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  font-size:12px;
  font-weight:800;
  letter-spacing:1px
}

.export-button span{
  font-size:10px;
  opacity:.75
}

.export-button:hover{
  background:rgba(0,255,136,.17)
}

.export-panel{
  margin-top:16px;
  border-top:1px solid var(--line);
  padding-top:16px
}

.export-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start
}

.export-kicker{
  font-size:8px;
  letter-spacing:2px;
  color:var(--green)
}

.export-head h3{
  font-size:17px;
  margin:4px 0
}

.copy{
  border:1px solid var(--line2);
  background:rgba(0,204,255,.1);
  color:var(--cyan);
  padding:8px 11px;
  border-radius:999px;
  display:flex;
  gap:6px;
  align-items:center;
  white-space:nowrap
}

.export-panel textarea{
  width:100%;
  margin-top:12px;
  background:#04060c;
  border:1px solid var(--line);
  color:#cfe6d8;
  border-radius:10px;
  padding:13px;
  font:11px/1.65 var(--mono);
  resize:vertical
}

.export-panel>p{
  font-size:10px;
  color:var(--dim);
  line-height:1.5
}

footer{
  margin-top:22px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  font-size:9px;
  letter-spacing:1px;
  color:var(--faint)
}

footer b{
  color:var(--dim)
}

@media(min-width:640px){
  .counters{
    grid-template-columns:repeat(4,1fr)
  }

  .progress{
    grid-column:auto
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .sliders{
    grid-template-columns:1fr 1fr
  }

  .hero{
    padding-top:38px
  }
}

@media(min-width:1024px){
  .grid{
    grid-template-columns:repeat(3,1fr)
  }

  .shell{
    padding-left:22px;
    padding-right:22px
  }

  footer{
    grid-template-columns:repeat(4,1fr)
  }
}

@media(min-width:1400px){
  .grid{
    grid-template-columns:repeat(4,1fr)
  }
}

@media(max-width:520px){
  .shell{
    padding-left:10px;
    padding-right:10px
  }

  .hero h1{
    font-size:38px;
    letter-spacing:-1px
  }

  .hero h1 .or{
    display:block;
    font-size:12px;
    padding:6px
  }

  .counters{
    gap:8px
  }

  .counter{
    padding:13px
  }

  .counter strong{
    font-size:30px
  }

  .actions{
    gap:4px
  }

  .action{
    padding:8px 2px
  }

  .action small{
    display:none
  }

  .export-head{
    align-items:stretch;
    flex-direction:column
  }

  .copy{
    align-self:flex-start
  }

  .control-head{
    align-items:flex-start
  }

  .reset{
    padding:7px
  }
}
