:root{
  --bg:#07090b;
  --surface:#0e1316;
  --surface2:#151d20;
  --line:#263238;
  --text:#f2f5f3;
  --muted:#a9b8b0;
  --primary:#d8ff2e;
  --primary2:#7df0c8;
  --danger:#ff6b5f;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#07090b;
    --surface:#0e1316;
    --surface2:#151d20;
    --line:#263238;
    --text:#f2f5f3;
    --muted:#a9b8b0;
    --primary:#d8ff2e;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height:1.5
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  background:var(--bg);
  padding-top:var(--safe-area-inset-top);
  overflow-x:clip
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:14px clamp(16px,4vw,48px);
  background:rgba(7,9,11,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px)
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0
}

.logo-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--primary);
  box-shadow:0 0 0 5px rgba(216,255,46,.14);
  flex:none
}

.brand strong{
  font-size:22px;
  letter-spacing:-.04em
}

.brand-sub{
  font-size:11px;
  letter-spacing:.14em;
  color:var(--muted);
  font-weight:800
}

.header-status{
  font-size:12px;
  white-space:nowrap
}

.header-status b{
  color:var(--primary)
}

.pulse{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--primary);
  animation:pulse 900ms ease-in-out infinite
}

@keyframes pulse{
  0%,100%{
    transform:scale(.8);
    opacity:.55
  }

  50%{
    transform:scale(1.35);
    opacity:1
  }
}

main{
  width:min(1180px,100%);
  margin:0 auto;
  padding:0 clamp(16px,4vw,48px) 40px
}

.hero{
  padding:clamp(44px,7vw,84px) 0 30px
}

.eyebrow{
  font-size:11px;
  letter-spacing:.18em;
  font-weight:900;
  color:var(--primary);
  margin:0 0 14px;
  display:flex;
  gap:6px;
  align-items:center
}

.hero h1{
  font-size:clamp(48px,9vw,108px);
  line-height:.86;
  letter-spacing:-.07em;
  margin:0;
  text-transform:uppercase
}

.hero h1 span{
  color:var(--primary)
}

.claim{
  font-size:clamp(24px,4vw,44px);
  line-height:1.1;
  letter-spacing:-.03em;
  margin:34px 0 12px
}

.claim strong{
  background:var(--primary);
  color:#0a0d09;
  padding:0 10px;
  display:inline-block;
  transform:rotate(-.4deg)
}

.sub{
  max-width:760px;
  color:var(--muted);
  font-size:17px;
  margin:0
}

.laugh{
  color:var(--primary2);
  font-weight:800
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-top:38px
}

.status-grid>div{
  background:var(--surface);
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:0
}

.status-grid small{
  font-size:10px;
  letter-spacing:.16em;
  color:var(--muted);
  font-weight:900
}

.status-grid strong{
  font-size:15px;
  line-height:1.3
}

.status-grid em{
  color:var(--muted);
  font-style:normal
}

.holo-dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--primary2);
  margin-right:5px;
  animation:pulse 900ms infinite
}

.search-wrap{
  padding:28px 0 8px
}

.search-box{
  display:flex;
  align-items:center;
  gap:14px;
  background:#fff;
  color:#111;
  border:4px solid var(--primary);
  padding:16px 18px;
  box-shadow:10px 10px 0 var(--primary)
}

.search-box input{
  border:0;
  outline:0;
  flex:1;
  min-width:0;
  font-size:clamp(18px,3vw,28px);
  font-weight:800;
  letter-spacing:-.02em;
  background:transparent
}

.search-box input::-moz-placeholder{
  color:#777;
  font-weight:600
}

.search-box input::placeholder{
  color:#777;
  font-weight:600
}

.clear{
  border:0;
  background:#111;
  color:#fff;
  border-radius:999px;
  padding:7px 12px;
  font-weight:800;
  white-space:nowrap
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  padding:9px 14px;
  border-radius:999px;
  font-weight:800;
  font-size:13px
}

.chip.active{
  background:var(--primary);
  color:#111;
  border-color:var(--primary)
}

.result-line{
  margin-top:16px;
  color:var(--muted);
  font-size:14px
}

.result-line strong,.result-line b{
  color:var(--text)
}

mark{
  background:var(--primary);
  color:#111;
  padding:0 4px
}

.notice{
  margin-top:12px;
  background:rgba(216,255,46,.12);
  border:1px solid var(--primary);
  padding:10px 12px;
  font-weight:700
}

.list-head{
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:end;
  margin:56px 0 22px
}

.list-head h2{
  font-size:clamp(32px,5vw,58px);
  line-height:.95;
  letter-spacing:-.04em;
  margin:0;
  text-transform:uppercase
}

.list-head>p{
  max-width:360px;
  color:var(--muted);
  margin:0
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.tile{
  background:var(--surface);
  border:1px solid var(--line);
  min-width:0
}

.tile.open{
  border-color:var(--primary);
  background:var(--surface2)
}

.tile-btn{
  width:100%;
  text-align:left;
  background:transparent;
  border:0;
  color:var(--text);
  padding:17px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px
}

.tile-top{
  grid-column:1/-1;
  display:flex;
  justify-content:space-between;
  gap:8px
}

.cat{
  font-size:10px;
  letter-spacing:.14em;
  font-weight:900;
  color:var(--primary)
}

.tag{
  font-size:10px;
  color:var(--muted);
  font-weight:800;
  text-align:right
}

.file{
  font-size:19px;
  font-weight:900;
  letter-spacing:-.02em;
  overflow-wrap:anywhere
}

.chev{
  display:flex;
  align-items:center
}

.rot{
  transform:rotate(180deg)
}

.desc{
  margin:0;
  padding:0 17px 17px;
  color:#d8e2dc;
  font-size:14px;
  line-height:1.6
}

.empty{
  grid-column:1/-1;
  border:1px dashed var(--line);
  padding:30px;
  text-align:center
}

.empty button{
  margin-top:12px;
  background:var(--primary);
  border:0;
  padding:10px 14px;
  font-weight:900
}

.map{
  margin-top:64px;
  border-top:4px solid var(--primary);
  padding-top:28px;
  background:linear-gradient(180deg,rgba(216,255,46,.06),transparent 55%);
  padding-bottom:20px
}

.map-head h2{
  font-size:clamp(34px,5vw,60px);
  line-height:.95;
  letter-spacing:-.04em;
  margin:0;
  text-transform:uppercase
}

.map-head>p:last-child{
  color:var(--muted);
  max-width:600px
}

.map-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-top:28px
}

.fix{
  background:var(--surface);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0
}

.fix>span{
  font-size:11px;
  color:var(--muted);
  font-weight:900
}

.fix strong{
  font-size:22px;
  letter-spacing:-.02em;
  overflow-wrap:anywhere
}

.fix small{
  color:var(--muted);
  font-size:12px
}

.map-bottom{
  display:grid;
  grid-template-columns:1fr 1.4fr 1fr;
  gap:24px;
  padding:24px 0;
  border-bottom:1px solid var(--line)
}

.map-bottom>div{
  display:flex;
  flex-direction:column
}

.map-bottom small{
  color:var(--muted);
  font-weight:900;
  letter-spacing:.14em;
  font-size:10px
}

.map-bottom strong{
  font-size:17px
}

.map-bottom .big{
  font-size:38px;
  color:var(--primary)
}

.map-bottom p{
  color:var(--muted);
  margin:4px 0 0;
  font-size:13px
}

.forward-banner{
  margin:48px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  background:var(--primary);
  color:#111;
  padding:26px
}

.forward-banner>div{
  display:flex;
  flex-direction:column
}

.forward-banner p{
  margin:4px 0 0;
  font-weight:800
}

.forward-banner h2{
  margin:0;
  font-size:clamp(28px,4vw,44px);
  letter-spacing:-.04em;
  line-height:1
}

.forward-banner button, footer button{
  border:2px solid #111;
  background:#111;
  color:#fff;
  padding:14px 18px;
  font-weight:900;
  display:flex;
  gap:8px;
  align-items:center;
  white-space:nowrap
}

footer{
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:22px clamp(16px,4vw,48px);
  flex-wrap:wrap
}

footer>div{
  display:flex;
  gap:16px;
  color:var(--muted);
  font-size:13px
}

footer>div span{
  display:flex;
  gap:6px;
  align-items:center
}

footer p{
  margin:0
}

footer button{
  padding:10px 14px
}

@media(max-width:760px){
  .topbar{
    align-items:flex-start
  }

  .brand-sub{
    display:none
  }

  .header-status{
    font-size:11px
  }

  .status-grid{
    grid-template-columns:1fr 1fr
  }

  .list-head{
    display:block
  }

  .list-head>p{
    margin-top:14px
  }

  .grid{
    grid-template-columns:1fr 1fr
  }

  .map-grid{
    grid-template-columns:1fr 1fr
  }

  .map-bottom{
    grid-template-columns:1fr
  }

  .forward-banner{
    align-items:flex-start;
    flex-direction:column
  }

  footer{
    flex-direction:column;
    align-items:flex-start
  }

  footer button{
    width:100%;
    justify-content:center
  }
}

@media(max-width:390px){
  .grid,.map-grid{
    grid-template-columns:1fr
  }

  .status-grid{
    grid-template-columns:1fr
  }

  .hero h1{
    font-size:44px
  }

  .search-box{
    padding:12px
  }

  .search-box input{
    font-size:17px
  }

  .clear{
    padding:6px 8px;
    font-size:12px
  }

  .header-status{
    max-width:130px;
    white-space:normal;
    text-align:right
  }
}

@media (prefers-reduced-motion: reduce){
  *{
    animation:none!important;
    scroll-behavior:auto!important
  }
}
</style>
