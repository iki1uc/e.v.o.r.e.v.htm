:root{
  --bg:#04070c;
  --surface:#0a131d;
  --surface2:#0e1a28;
  --line:#1c344a;
  --text:#eafcff;
  --muted:#8fb3c6;
  --ice:#00c8ff;
  --fire:#ff4400;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Chakra Petch',system-ui,sans-serif
}

button{
  font-family:inherit;
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 14px 22px;
  background:radial-gradient(900px 320px at 12% 0%,rgba(0,200,255,.14),transparent 60%),radial-gradient(900px 340px at 88% 0%,rgba(255,68,0,.15),transparent 60%),var(--bg)
}

.topbar{
  max-width:1280px;
  margin:0 auto;
  padding:16px 4px 10px;
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:16px;
  flex-wrap:wrap
}

.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.16em;
  color:var(--muted)
}

.eyebrow b{
  color:var(--ice)
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--ice);
  box-shadow:0 0 12px var(--ice);
  margin-right:7px
}

h1{
  font-size:clamp(36px,6vw,62px);
  line-height:.9;
  margin:7px 0 0;
  letter-spacing:-.04em
}

h1 span{
  color:var(--fire);
  text-shadow:0 0 22px rgba(255,68,0,.5)
}

.header-state{
  display:flex;
  gap:14px;
  align-items:center
}

.header-state>div:first-child{
  display:grid
}

.header-state small{
  font-family:'JetBrains Mono',monospace;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.15em
}

.header-state strong{
  font-size:15px
}

.header-state strong.ice{
  color:var(--ice)
}

.header-state strong.fire{
  color:var(--fire)
}

.live{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  border:1px solid var(--line);
  padding:8px 10px;
  border-radius:999px
}

.live span{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#3dff8a;
  margin-right:6px;
  box-shadow:0 0 10px #3dff8a
}

.nc-wrap{
  max-width:1280px;
  margin:0 auto;
  background:linear-gradient(180deg,#0b1826,#081019);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.35)
}

.nc-wrap.reloading{
  animation:reloadFlash .7s ease
}

@keyframes reloadFlash{
  0%{
    box-shadow:0 0 0 3px var(--ice)
  }

  100%{
    box-shadow:0 0 0 0 transparent
  }
}

.nc-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:11px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px
}

.nc-head>span:first-child{
  display:flex;
  gap:7px;
  align-items:center;
  color:var(--ice)
}

.nc-count{
  color:var(--muted)
}

kbd{
  font-family:'JetBrains Mono',monospace;
  border:1px solid #3a556d;
  border-bottom-width:2px;
  padding:1px 6px;
  border-radius:5px;
  background:#071018;
  font-size:10px
}

.nc-bar{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.nc{
  border:1px solid var(--line);
  background:#0c1a29;
  color:#fff;
  border-radius:10px;
  padding:11px 13px;
  font-weight:700;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:7px;
  transition:.15s
}

.nc:hover{
  transform:translateY(-1px);
  border-color:#fff
}

.nc:active{
  transform:scale(.97)
}

.freeze{
  color:var(--ice);
  border-color:#14586e
}

.thaw{
  color:#a8f2ff
}

.balance{
  color:#b7ffca;
  border-color:#2a6a49
}

.tiefe{
  color:#c9a8ff;
  border-color:#4c3a79
}

.fall{
  color:#ffd166;
  border-color:#6a511e
}

.mystery{
  color:#ff8ad6;
  border-color:#6a2a52
}

.wunder{
  color:#fff;
  background:linear-gradient(90deg,#ff4400,#ff9a00);
  border-color:#ff7a00
}

.reload-btn{
  margin-top:10px;
  background:transparent;
  border:0;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px
}

.reload-btn:hover{
  color:#fff
}

.reload-btn span{
  color:#5f7f93
}

.explain{
  margin-top:12px;
  background:rgba(0,200,255,.07);
  border:1px dashed rgba(0,200,255,.45);
  border-radius:12px;
  padding:11px 13px;
  font-size:13px;
  line-height:1.55
}

.explain b{
  color:var(--ice)
}

.explain p{
  margin:4px 0 0;
  color:#cdeaf7
}

.stats{
  max-width:1280px;
  margin:12px auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px
}

.stat{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  min-width:0
}

.stat-top{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.12em
}

.stat strong{
  font-size:31px;
  line-height:1.1;
  display:block;
  margin:6px 0
}

.stat em{
  font-size:15px;
  color:var(--muted);
  font-style:normal
}

.stat small{
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
  display:block
}

.bar{
  height:7px;
  background:#12202e;
  border-radius:99px;
  overflow:hidden;
  margin:7px 0
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--ice),var(--fire))
}

.hpbar i{
  background:linear-gradient(90deg,#3dff8a,#ffd166)
}

.scorebar i{
  background:#ffd166
}

.depth strong{
  color:#c9a8ff
}

.depth-dots{
  display:flex;
  gap:5px;
  margin-top:9px
}

.depth-dots i{
  width:18px;
  height:5px;
  border-radius:99px;
  background:#1d2f41
}

.depth-dots i.on{
  background:#c9a8ff
}

.fall strong{
  color:#ffd166
}

.fall-note{
  display:inline-block;
  margin-top:8px;
  background:rgba(255,209,102,.12);
  border:1px solid rgba(255,209,102,.35);
  color:#ffd166;
  padding:4px 7px;
  border-radius:99px;
  font-size:11px
}

.signal-banner{
  max-width:1280px;
  margin:12px auto 0;
  background:var(--fire);
  color:#fff;
  text-align:center;
  font-weight:800;
  letter-spacing:.18em;
  padding:9px;
  border-radius:10px
}

.arena{
  max-width:1280px;
  margin:12px auto;
  display:grid;
  grid-template-columns:1fr 1.35fr 1fr;
  gap:10px
}

.realm{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px
}

.ice-realm{
  border-top:3px solid var(--ice)
}

.fire-realm{
  border-top:3px solid var(--fire)
}

.realm-head{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:800;
  letter-spacing:.08em
}

.realm-head span{
  margin-left:auto;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted)
}

.realm>p{
  color:var(--muted);
  font-size:12px;
  margin:8px 0 10px
}

.cells{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px
}

.cell{
  aspect-ratio:1;
  border-radius:10px;
  border:1px solid #20364a;
  background:#08131f;
  color:#637f92;
  display:grid;
  place-items:center;
  position:relative;
  font-family:'JetBrains Mono',monospace
}

.cell span{
  position:absolute;
  top:4px;
  left:6px;
  font-size:9px
}

.cell i{
  font-style:normal;
  font-size:19px;
  opacity:.25
}

.cell.lit{
  color:#fff
}

.ice-cell.lit{
  background:rgba(0,200,255,.18);
  border-color:var(--ice);
  box-shadow:0 0 14px rgba(0,200,255,.18)
}

.ice-cell.lit i{
  opacity:1
}

.fire-cell.lit{
  background:rgba(255,68,0,.18);
  border-color:var(--fire);
  box-shadow:0 0 14px rgba(255,68,0,.18)
}

.fire-cell.lit i{
  opacity:1
}

.realm-foot{
  margin-top:11px;
  font-size:12px;
  color:var(--muted);
  border-top:1px solid var(--line);
  padding-top:9px
}

.ymir-stage{
  background:linear-gradient(180deg,#10202f,#071018);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  text-align:center;
  overflow:hidden
}

.stage-label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.15em;
  color:var(--muted)
}

.stage-label b{
  color:#fff;
  font-size:14px
}

.monster-wrap{
  position:relative;
  max-width:330px;
  margin:4px auto;
  transition:transform .35s
}

.monster-wrap svg{
  width:100%;
  height:auto;
  display:block
}

.monster-wrap.falling{
  animation:fallAnim 1.25s ease
}

.monster-wrap.frozen-monster svg{
  filter:saturate(.35) brightness(1.15)
}

@keyframes fallAnim{
  0%{
    transform:translateY(0) rotate(0)
  }

  28%{
    transform:translateY(52px) rotate(72deg) scale(.96)
  }

  55%{
    transform:translateY(14px) rotate(180deg)
  }

  82%{
    transform:translateY(0) rotate(340deg)
  }

  100%{
    transform:translateY(0) rotate(360deg)
  }
}

.ice-cage{
  position:absolute;
  inset:22% 8% auto;
  background:rgba(0,200,255,.16);
  border:1px solid var(--ice);
  padding:7px;
  border-radius:10px;
  font-weight:800;
  font-size:12px;
  letter-spacing:.14em;
  color:#bdf2ff
}

.stage-controls{
  display:flex;
  gap:7px;
  justify-content:center
}

.stage-controls button{
  background:#0a1724;
  border:1px solid var(--line);
  color:#fff;
  border-radius:999px;
  padding:9px 12px;
  font-weight:700;
  font-size:12px
}

.stage-controls button:hover{
  border-color:var(--ice)
}

.mystery{
  max-width:1280px;
  margin:0 auto;
  border:1px dashed #4a365a;
  background:#120c18;
  border-radius:14px;
  padding:13px
}

.mystery.open{
  border-color:#ff8ad6;
  box-shadow:0 0 24px rgba(255,138,214,.12)
}

.mystery-head{
  display:flex;
  gap:8px;
  align-items:center
}

.mystery-head span{
  margin-left:auto;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  font-size:11px
}

.mystery-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:11px
}

.mystery-grid>div{
  background:#0a111a;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  display:grid;
  gap:3px
}

.mystery-grid small{
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  font-size:10px
}

.mystery-grid strong{
  font-size:20px
}

.blur{
  filter:blur(7px);
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none
}

.two-col{
  max-width:1280px;
  margin:12px auto;
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:10px
}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px
}

.panel-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.1em;
  color:var(--muted);
  margin-bottom:12px
}

.panel-head b{
  color:#fff
}

.puppets{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}

.puppet{
  background:#0a1724;
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px;
  text-align:left;
  color:#fff;
  display:grid;
  gap:3px
}

.puppet strong{
  font-size:14px
}

.puppet span{
  color:var(--ice);
  font-size:10px;
  letter-spacing:.12em
}

.puppet em{
  font-style:normal;
  color:#ffd166;
  font-size:11px
}

.puppet small{
  color:var(--muted);
  font-size:11px;
  line-height:1.35
}

.puppet.active{
  border-color:var(--ice);
  background:rgba(0,200,255,.1);
  box-shadow:0 0 0 1px var(--ice)
}

.sig-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.sig-buttons button{
  border-radius:11px;
  padding:12px;
  border:1px solid var(--line);
  background:#0a1724;
  color:#fff;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800
}

.sigint{
  color:#ffd166
}

.sigterm{
  color:#ff7a6a
}

.sig-buttons small{
  color:var(--muted);
  font-weight:500
}

.sig-buttons kbd{
  margin-left:auto
}

.stop{
  font-size:14px
}

.keys{
  display:flex;
  flex-wrap:wrap;
  gap:13px;
  margin:12px 0;
  color:var(--muted);
  font-size:12px
}

.sig-note{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin:0
}

.zone-table{
  margin-top:12px;
  border-top:1px solid var(--line);
  padding-top:10px
}

.zone-table b{
  font-size:11px;
  letter-spacing:.1em;
  color:var(--muted)
}

.zone-table>div{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
  border-bottom:1px solid #142333;
  font-family:'JetBrains Mono',monospace;
  font-size:12px
}

.zone-table i{
  font-style:normal;
  color:#ffd166
}

.log-panel{
  max-width:1280px;
  margin:0 auto;
  background:#050a10;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden
}

.log-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 14px;
  border-bottom:1px solid var(--line)
}

.log-head span{
  margin-left:auto;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  font-size:11px
}

.log{
  height:188px;
  overflow-y:auto;
  padding:12px 14px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  line-height:1.75;
  color:#9fd8ee
}

.log div{
  white-space:pre-wrap;
  word-break:break-word
}

footer{
  max-width:1280px;
  margin:14px auto 0;
  text-align:center;
  color:#5f7f93;
  font-size:12px
}

@media (prefers-color-scheme:dark){
  :root{
    --bg:#04070c;
    --surface:#0a131d
  }
}

@media(max-width:900px){
  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  .arena{
    grid-template-columns:1fr
  }

  .puppets{
    grid-template-columns:repeat(2,1fr)
  }

  .two-col{
    grid-template-columns:1fr
  }

  .mystery-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .stats .stat:last-child{
    grid-column:span 2
  }
}

@media(max-width:520px){
  .app-shell{
    padding-left:10px;
    padding-right:10px
  }

  .stats{
    grid-template-columns:1fr 1fr
  }

  .nc{
    flex:1 1 42%;
    justify-content:center;
    padding:10px 8px
  }

  .header-state{
    width:100%;
    justify-content:space-between
  }

  .mystery-grid{
    grid-template-columns:1fr 1fr
  }

  .sig-buttons{
    grid-template-columns:1fr
  }

  .cells{
    grid-template-columns:repeat(4,1fr)
  }

  .realm{
    order:2
  }

  .ymir-stage{
    order:1
  }
}
