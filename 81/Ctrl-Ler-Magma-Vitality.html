:root{
  --bg:#0a0705;
  --panel:#150d07;
  --gold:#ffd700;
  --magma:#ff6b35;
  --line:rgba(255,215,0,.22);
  --ink:#f2dcae;
  --muted:#9a7f58
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  width:100%;
  padding:var(--safe-area-inset-top) 12px 18px;
  position:relative;
  overflow-x:clip;
  background:radial-gradient(ellipse at 50% 110%,rgba(255,80,0,.22),transparent 55%),var(--bg)
}

.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0
}

.stars i{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  opacity:.7;
  animation:twinkle 3s ease-in-out infinite
}

@keyframes twinkle{
  50%{
    opacity:.2
  }
}

.magma-glow{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:180px;
  pointer-events:none;
  background:linear-gradient(to top,rgba(255,70,0,.28),transparent);
  z-index:0
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  background:linear-gradient(90deg,rgba(22,13,6,.96),rgba(46,24,8,.96));
  border:2px solid rgba(255,215,0,.42);
  border-radius:12px;
  padding:12px 16px;
  box-shadow:0 0 34px rgba(255,120,0,.14)
}

.topbar h1{
  margin:0;
  font-size:clamp(18px,3vw,28px);
  letter-spacing:.16em;
  color:var(--gold)
}

.topbar h1 span{
  font-size:.62em;
  color:#ffb84d;
  letter-spacing:.12em
}

.topbar p{
  margin:4px 0 0;
  font-size:10px;
  letter-spacing:.18em;
  color:var(--muted);
  text-transform:uppercase
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  letter-spacing:.14em
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#7cfc00;
  box-shadow:0 0 10px #7cfc00;
  animation:pulse 1.4s infinite
}

@keyframes pulse{
  50%{
    opacity:.4
  }
}

.sep{
  color:#6d5838
}

.clock{
  color:var(--gold)
}

main{
  position:relative;
  z-index:1;
  max-width:1280px;
  margin:18px auto 0;
  display:flex;
  flex-direction:column;
  gap:18px
}

.wheel-wrap{
  position:relative;
  min-height:430px;
  border:1px solid rgba(255,215,0,.18);
  border-radius:16px;
  overflow:hidden;
  background:radial-gradient(circle at center,rgba(56,26,6,.42),rgba(8,5,3,.92) 68%);
  box-shadow:inset 0 0 60px rgba(255,80,0,.08)
}

.paths{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1
}

.center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:250px;
  height:250px;
  z-index:2
}

.orbit{
  position:absolute;
  left:50%;
  top:50%;
  border:1px dashed;
  border-radius:50%;
  pointer-events:none
}

.orbit span{
  position:absolute;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:7px;
  letter-spacing:.14em;
  background:#0a0705;
  padding:2px 6px;
  border-radius:4px;
  white-space:nowrap
}

.orbit-9{
  width:82%;
  height:82%;
  transform:translate(-50%,-50%);
  border-color:rgba(255,215,0,.35);
  animation:spin 42s linear infinite
}

.orbit-9 span{
  top:0;
  color:#ffd700
}

.orbit-99{
  width:102%;
  height:102%;
  transform:translate(-50%,-50%);
  border-color:rgba(0,229,255,.22);
  animation:spin 62s linear infinite reverse
}

.orbit-99 span{
  right:-4px;
  left:auto;
  top:50%;
  transform:translate(50%,-50%);
  color:#00e5ff
}

.orbit-999{
  width:122%;
  height:122%;
  transform:translate(-50%,-50%);
  border-color:rgba(124,252,0,.18);
  animation:spin 90s linear infinite
}

.orbit-999 span{
  bottom:0;
  top:auto;
  color:#7cfc00
}

@keyframes spin{
  to{
    transform:translate(-50%,-50%) rotate(360deg)
  }
}

.aura{
  position:absolute;
  left:50%;
  top:50%;
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,140,0,.48),rgba(255,60,0,.18) 45%,transparent 72%);
  filter:blur(10px);
  pointer-events:none
}

.breath-ring{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:245px;
  height:245px;
  pointer-events:none
}

.breath-ring .track{
  fill:none;
  stroke:rgba(255,215,0,.14);
  stroke-width:3
}

.breath-ring .prog{
  fill:none;
  stroke:#ffb300;
  stroke-width:5;
  stroke-linecap:round;
  transform-origin:center;
  transform:rotate(-90deg);
  filter:drop-shadow(0 0 8px #ff8c00);
  transition:stroke-dashoffset .05s linear
}

.burro{
  position:absolute;
  left:50%;
  top:50%;
  width:118px;
  height:118px;
  border:0;
  background:transparent;
  font-size:84px;
  line-height:1;
  filter:drop-shadow(0 0 22px rgba(255,180,0,.75));
  z-index:3
}

.burro:active{
  filter:brightness(1.3) drop-shadow(0 0 30px #ffd700)
}

.burro-label{
  position:absolute;
  left:50%;
  top:calc(50% + 86px);
  transform:translateX(-50%);
  text-align:center;
  font-size:9px;
  letter-spacing:.2em;
  color:#ffd700;
  white-space:nowrap
}

.burro-label small{
  color:#9a7f58;
  letter-spacing:.1em
}

.node{
  position:absolute;
  transform:translate(-50%,-50%);
  min-width:112px;
  background:linear-gradient(135deg,rgba(24,14,6,.96),rgba(48,26,8,.96));
  border:2px solid;
  border-radius:11px;
  padding:8px 9px;
  text-align:center;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:2px;
  backdrop-filter:blur(8px);
  transition:transform .18s,box-shadow .2s
}

.node:hover{
  transform:translate(-50%,-50%) scale(1.08);
  z-index:10
}

.node.active{
  transform:translate(-50%,-50%) scale(1.12);
  z-index:12;
  animation:glow 1.4s infinite
}

@keyframes glow{
  50%{
    filter:brightness(1.25)
  }
}

.node .num{
  font-size:14px;
  font-weight:900
}

.node .name{
  font-size:8px;
  letter-spacing:.14em
}

.node .desc{
  font-size:7px;
  opacity:.6;
  color:#e8cfa0
}

.bubble{
  position:absolute;
  left:50%;
  top:14px;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#ffd700,#ff8c00);
  color:#1a0f00;
  padding:9px 14px;
  border-radius:14px;
  font-weight:900;
  font-size:12px;
  z-index:30;
  box-shadow:0 0 24px rgba(255,180,0,.7)
}

.hint{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  font-size:8px;
  letter-spacing:.16em;
  color:#8a6a3a;
  background:rgba(10,7,5,.78);
  padding:4px 12px;
  border-radius:6px;
  white-space:nowrap;
  z-index:4
}

.bottom-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
  gap:18px
}

.panel{
  background:linear-gradient(135deg,rgba(28,15,5,.95),rgba(42,24,8,.95));
  border:1px solid rgba(255,215,0,.25);
  border-radius:14px;
  padding:18px;
  min-width:0;
  box-shadow:0 0 24px rgba(255,90,0,.08)
}

.panel-head{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:12px
}

.panel-head h2{
  margin:0;
  font-size:12px;
  letter-spacing:.18em;
  color:#ffd700
}

.panel-head p{
  margin:2px 0 0;
  font-size:8px;
  color:#9a7f58;
  letter-spacing:.08em
}

.ico{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(255,90,0,.16);
  color:#ff8c00;
  flex-shrink:0
}

.ico.green{
  background:rgba(124,252,0,.14);
  color:#7cfc00
}

.ico.gold{
  background:rgba(255,215,0,.14);
  color:#ffd700
}

.magma-badge,.vital-badge,.auto-state{
  margin-left:auto;
  font-size:8px;
  letter-spacing:.12em;
  padding:4px 7px;
  border-radius:999px;
  border:1px solid rgba(255,215,0,.3);
  color:#ffd700;
  white-space:nowrap
}

.magma-badge.erupt{
  background:#ff2d00;
  color:#fff;
  border-color:#fff;
  animation:blink 0.8s infinite
}

@keyframes blink{
  50%{
    opacity:.55
  }
}

.magma-temp{
  display:flex;
  align-items:center;
  gap:8px;
  color:#ff8c00
}

.magma-temp strong{
  font-size:26px;
  color:#fff
}

.magma-temp span{
  margin-left:auto;
  font-size:11px;
  color:#ffb84d
}

.slider-label{
  display:flex;
  justify-content:space-between;
  font-size:8px;
  letter-spacing:.14em;
  color:#9a7f58;
  margin:12px 0 6px
}

.slider-label span{
  color:#ffd700
}

input[type=range]{
  width:100%;
  height:5px;
  -webkit-appearance:none;
     -moz-appearance:none;
          appearance:none;
  background:rgba(255,215,0,.18);
  border-radius:4px;
  outline:none;
  cursor:pointer
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
          appearance:none;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#ffd700;
  box-shadow:0 0 12px #ffd700;
  border:0
}

input[type=range]::-moz-range-thumb{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#ffd700;
  border:0
}

.magma-bar{
  height:18px;
  background:rgba(0,0,0,.45);
  border-radius:9px;
  overflow:hidden;
  position:relative;
  margin-top:10px;
  border:1px solid rgba(255,100,0,.25)
}

.magma-fill{
  height:100%;
  background:linear-gradient(90deg,#ff2d00,#ff8c00,#ffd700);
  transition:width .3s
}

.magma-bar span{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:8px;
  letter-spacing:.3em;
  color:#fff;
  text-shadow:0 0 4px #000
}

.magma-meta{
  display:flex;
  justify-content:space-between;
  font-size:8px;
  color:#9a7f58;
  margin-top:5px
}

.burst-btn{
  width:100%;
  margin-top:12px;
  border:1.5px solid #ff8c00;
  background:rgba(255,80,0,.16);
  color:#ffb84d;
  padding:10px;
  border-radius:9px;
  font-weight:900;
  letter-spacing:.16em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px
}

.burst-btn:hover{
  background:rgba(255,80,0,.3)
}

.burst-btn:active{
  transform:scale(.98)
}

.eruption-warn{
  margin-top:9px;
  background:rgba(255,45,0,.16);
  border:1px solid #ff2d00;
  color:#ffd9c8;
  padding:8px;
  border-radius:8px;
  font-size:10px;
  line-height:1.4
}

.lava-box{
  height:42px;
  position:relative;
  overflow:hidden;
  margin-top:10px;
  border-radius:8px;
  background:linear-gradient(to top,rgba(255,60,0,.18),transparent);
  border-top:1px solid rgba(255,120,0,.2)
}

.lava-surface{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:7px;
  background:linear-gradient(90deg,#ff2d00,#ff8c00,#ffd700);
  filter:blur(.4px)
}

.lava-particle{
  position:absolute;
  bottom:4px;
  border-radius:50%;
  animation:rise 1.7s ease-out forwards;
  box-shadow:0 0 10px currentColor
}

@keyframes rise{
  to{
    transform:translateY(-42px) scale(.2);
    opacity:0
  }
}

.vital-badge.danger{
  background:#ff2d00;
  color:#fff;
  animation:blink .7s infinite
}

.vital-badge.strong{
  background:rgba(124,252,0,.16);
  color:#7cfc00;
  border-color:#7cfc00
}

.vitals{
  display:flex;
  flex-direction:column;
  gap:11px
}

.vital-top{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:.1em
}

.vital-top b{
  color:#ffd700
}

.bar{
  height:7px;
  background:rgba(255,255,255,.08);
  border-radius:4px;
  overflow:hidden;
  margin-top:5px
}

.fill{
  height:100%;
  border-radius:4px;
  transition:width .35s
}

.water-alert{
  margin-top:12px;
  background:rgba(255,45,0,.18);
  border:1px solid #ff2d00;
  color:#fff;
  padding:9px;
  border-radius:8px;
  font-size:10px;
  animation:blink 1s infinite
}

.strong-note{
  margin-top:12px;
  background:rgba(124,252,0,.12);
  border:1px solid rgba(124,252,0,.4);
  color:#d8ffb0;
  padding:9px;
  border-radius:8px;
  font-size:10px
}

.auto-state.off{
  color:#9a7f58
}

.sliders{
  display:flex;
  flex-direction:column;
  gap:10px
}

.sliders label{
  display:flex;
  flex-direction:column;
  gap:5px;
  font-size:8px;
  letter-spacing:.14em;
  color:#9a7f58;
  text-transform:uppercase
}

.sliders label span{
  color:#ffd700
}

.ctrl-buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-top:12px
}

.ctrl-buttons button{
  border:1.5px solid rgba(255,215,0,.4);
  background:rgba(255,215,0,.08);
  color:#ffd700;
  border-radius:8px;
  padding:9px 5px;
  font-size:10px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px
}

.ctrl-buttons button.active{
  background:#ffd700;
  color:#1a0f00
}

.ctrl-buttons button.breath{
  border-color:rgba(0,229,255,.5);
  color:#00e5ff;
  background:rgba(0,229,255,.08)
}

.ctrl-buttons button.water-btn{
  border-color:rgba(74,159,224,.5);
  color:#4a9fe0;
  background:rgba(74,159,224,.08)
}

.ctrl-note{
  font-size:9px;
  color:#9a7f58;
  line-height:1.5;
  margin:10px 0 0
}

.terminal{
  background:rgba(0,0,0,.82);
  border:1px solid rgba(124,252,0,.22);
  border-radius:10px;
  padding:10px 12px;
  height:132px;
  overflow:auto;
  font-size:10px;
  line-height:1.6
}

.terminal .line{
  opacity:0;
  animation:fade .3s forwards
}

.terminal .ok{
  color:#7cfc00
}

.terminal .warn{
  color:#ffd700
}

.terminal .err{
  color:#ff4a2e
}

.terminal .info{
  color:#00e5ff
}

.terminal .burro{
  color:#ffb300
}

.terminal .magma{
  color:#ff8c00
}

.terminal .water{
  color:#4a9fe0
}

@keyframes fade{
  to{
    opacity:1
  }
}

@media(max-width:900px){
  .bottom-grid{
    grid-template-columns:1fr 1fr
  }

  .ctrl-panel{
    grid-column:1/-1
  }
}

@media(max-width:760px){
  .shell{
    padding-left:8px;
    padding-right:8px
  }

  .topbar{
    padding:10px
  }

  .topbar h1{
    font-size:19px
  }

  .topbar h1 span{
    display:block;
    font-size:9px;
    margin-top:3px
  }

  .status{
    font-size:9px
  }

  .wheel-wrap{
    min-height:500px
  }

  .center{
    width:190px;
    height:190px
  }

  .breath-ring{
    width:185px;
    height:185px
  }

  .burro{
    width:92px;
    height:92px;
    font-size:64px
  }

  .burro-label{
    top:calc(50% + 66px)
  }

  .orbit-99 span{
    font-size:6px
  }

  .node{
    min-width:86px;
    padding:6px 6px
  }

  .node .num{
    font-size:11px
  }

  .node .name{
    font-size:7px
  }

  .node .desc{
    display:none
  }

  .hint{
    font-size:7px;
    white-space:normal;
    text-align:center;
    width:92%
  }

  .bottom-grid{
    grid-template-columns:1fr
  }

  .ctrl-panel{
    grid-column:auto
  }

  .terminal{
    height:110px
  }

  .bubble{
    font-size:11px;
    max-width:92vw;
    text-align:center
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0705
  }
}
