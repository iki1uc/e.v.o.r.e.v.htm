  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px
}

.gold{
  color:var(--gold)
}

.cyan{
  color:var(--cyan)
}

.green{
  color:var(--green)
}

.muted{
  color:var(--muted)
}

.btn{
  background:#262a1e;
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:999px;
  padding:9px 14px;
  font-weight:700
}

.btn:hover{
  border-color:var(--gold)
}

.btn-gold{
  background:var(--gold);
  color:#191507;
  border-color:var(--gold)
}

.btn-cyan{
  background:var(--cyan);
  color:#06222a;
  border-color:var(--cyan)
}

.btn-green{
  background:var(--green);
  color:#0d2412;
  border-color:var(--green)
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 9px;
  font-size:12px;
  background:#20241a
}

input[type=range]{
  width:100%;
  accent-color:var(--gold)
}

input[type=text],select,textarea{
  background:#0f120d;
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:8px;
  padding:8px 10px;
  width:100%
}

.cube-scene{
  perspective:900px;
  height:180px;
  display:grid;
  place-items:center
}

.cube{
  width:112px;
  height:112px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.2,.8,.2,1)
}

.face{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  border:2px solid var(--gold);
  background:rgba(232,200,122,.12);
  font-weight:900;
  letter-spacing:.08em
}

@keyframes flowMove{
  from{
    background-position:0 0
  }

  to{
    background-position:44px 0
  }
}

.flow{
  background:repeating-linear-gradient(90deg,var(--cyan) 0 14px,transparent 14px 28px);
  background-size:44px 100%;
  animation:flowMove 1s linear infinite;
  height:8px;
  border-radius:99px
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(232,200,122,.45)
  }

  50%{
    box-shadow:0 0 0 10px rgba(232,200,122,0)
  }
}

.pulse{
  animation:pulseGold 1.8s infinite
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

.blink{
  animation:blink 1s infinite
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0d0f0c;
    --surface:#151811;
    --ink:#f2ead1
  }
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-\[1fr_1fr_auto\] {
    grid-template-columns: 1fr 1fr auto;
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[38px\] {
    font-size: 38px;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1fr_260px\] {
    grid-template-columns: 1fr 260px;
  }

  .md\:grid-cols-\[1fr_280px\] {
    grid-template-columns: 1fr 280px;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[300px_1fr\] {
    grid-template-columns: 300px 1fr;
  }
}
</style>
